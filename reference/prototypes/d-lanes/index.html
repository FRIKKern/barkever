<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barkever · Day lanes</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-2xs: 10px; --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 15px; --fs-xl: 19px; --fs-2xl: 26px;
  --fw-med: 500; --fw-bold: 600;
  --lh-tight: 1.25; --lh: 1.5;
  --sp-1: 2px; --sp-2: 4px; --sp-3: 6px; --sp-4: 8px; --sp-5: 12px; --sp-6: 16px; --sp-7: 24px; --sp-8: 32px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-pill: 999px; --r-device: 34px;
  --row-h: 40px; --top-h: 48px; --side-w: 228px; --list-w: 316px; --ask-w: 384px; --lane-label-w: 108px; --doc-w: 700px;
  --cb: 15px;

  --bg: #ffffff;
  --bg-side: #f6f6f3;
  --bg-sunk: #f1f1ee;
  --bg-hover: #efefeb;
  --bg-sel: #e6eeed;
  --bg-raised: #ffffff;
  --ink: #1d1f22;
  --ink-2: #5c6269;
  --ink-3: #8f959c;
  --line: #e6e6e1;
  --line-strong: #d4d4ce;
  --accent: #23706a;
  --accent-ink: #ffffff;
  --accent-soft: #e2eeec;
  --late: #b3473b;
  --add-bg: #dcf1e2; --add-ink: #1d6a38;
  --del-bg: #fbe3e0; --del-ink: #a5372d;
  --mark-bg: #f8edc8;
  --warn-bg: #f7f3e8; --warn-ink: #6f5a24;
  --shadow: 0 1px 2px rgba(20,20,20,.05), 0 6px 20px rgba(20,20,20,.07);
  --p1: #4369a8; --p2: #b5822a; --p3: #8a6b5c; --p4: #7759a6; --p5: #5a8746; --p6: #b3613f;
}
:root[data-theme="dark"] {
  --bg: #17181a;
  --bg-side: #1d1e21;
  --bg-sunk: #131416;
  --bg-hover: #25272a;
  --bg-sel: #1f3331;
  --bg-raised: #202124;
  --ink: #e6e7e9;
  --ink-2: #a2a7ad;
  --ink-3: #70767d;
  --line: #2a2c30;
  --line-strong: #3a3d42;
  --accent: #5db2a6;
  --accent-ink: #0f1a19;
  --accent-soft: #1d3432;
  --late: #e3796c;
  --add-bg: #173a24; --add-ink: #8fdaa8;
  --del-bg: #43201d; --del-ink: #f1a197;
  --mark-bg: #4a3f1c;
  --warn-bg: #26231b; --warn-ink: #d9c38a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --p1: #7d9fd8; --p2: #d6a656; --p3: #b8988a; --p4: #a68bd4; --p5: #8dbb76; --p6: #db8b69;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: var(--fs-md)/var(--lh) var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
.muted { color: var(--ink-3); }
.grow { flex: 1; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pc, var(--ink-3)); flex: none; }
.pc1 { --pc: var(--p1); } .pc2 { --pc: var(--p2); } .pc3 { --pc: var(--p3); } .pc4 { --pc: var(--p4); } .pc5 { --pc: var(--p5); } .pc6 { --pc: var(--p6); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) auto; height: 100vh; overflow: hidden; background: var(--bg); }
.side { background: var(--bg-side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.view { flex: 1; min-height: 0; display: flex; }

.brand { display: flex; align-items: center; gap: var(--sp-4); padding: 0 var(--sp-6); height: var(--top-h); font-weight: var(--fw-bold); letter-spacing: -.01em; }
.brand-mark { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); position: relative; }
.brand-mark::before, .brand-mark::after { content: ""; position: absolute; left: 4px; right: 4px; height: 2px; border-radius: 1px; background: var(--accent-ink); }
.brand-mark::before { top: 6px; } .brand-mark::after { top: 10px; right: 7px; }
.nav { flex: 1; overflow: auto; padding: 0 var(--sp-4) var(--sp-5); }
.nav-h { font-size: var(--fs-2xs); font-weight: var(--fw-bold); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: var(--sp-6) var(--sp-4) var(--sp-3); }
.nav-i { display: flex; align-items: center; gap: var(--sp-4); width: 100%; height: 28px; padding: 0 var(--sp-4); border-radius: var(--r-md); color: var(--ink-2); text-align: left; white-space: nowrap; }
.nav-i:hover { background: var(--bg-hover); }
.nav-i.on { background: var(--bg-sel); color: var(--ink); font-weight: var(--fw-med); }
.nav-i .n { margin-left: auto; font-size: var(--fs-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-i.sub { padding-left: 30px; }
.nav-i .lbl { overflow: hidden; text-overflow: ellipsis; }
.minibar { margin-left: auto; width: 34px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--pc) 22%, transparent); overflow: hidden; flex: none; }
.minibar i { display: block; height: 100%; background: var(--pc); }
.sync { display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-5) var(--sp-6); border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--ink-3); }
.sync .dot { --pc: var(--p5); width: 6px; height: 6px; }
.sync.off .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }

.top { height: var(--top-h); flex: none; display: flex; align-items: center; gap: var(--sp-5); padding: 0 var(--sp-6) 0 var(--sp-7); border-bottom: 1px solid var(--line); }
.crumb { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; font-weight: var(--fw-med); white-space: nowrap; }
.crumb .sep { color: var(--ink-3); font-weight: 400; }
.search { margin-left: auto; display: flex; align-items: center; gap: var(--sp-4); width: 340px; height: 30px; padding: 0 var(--sp-4); border-radius: var(--r-md); background: var(--bg-sunk); color: var(--ink-3); border: 1px solid transparent; }
.search:focus-within { border-color: var(--line-strong); background: var(--bg); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: var(--fs-md); color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; gap: var(--sp-3); height: 28px; padding: 0 var(--sp-5); border-radius: var(--r-md); color: var(--ink-2); font-weight: var(--fw-med); white-space: nowrap; }
.btn:hover { background: var(--bg-hover); color: var(--ink); }
.btn.line { border: 1px solid var(--line-strong); }
.btn.on { background: var(--accent-soft); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); color: var(--accent-ink); }
.btn.sm { height: 24px; padding: 0 var(--sp-4); font-size: var(--fs-sm); }

.banner { flex: none; display: flex; align-items: center; gap: var(--sp-4); height: 30px; padding: 0 var(--sp-7); background: var(--warn-bg); color: var(--warn-ink); font-size: var(--fs-sm); border-bottom: 1px solid var(--line); }
.banner .dot { width: 6px; height: 6px; background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.banner button { margin-left: auto; text-decoration: underline; text-underline-offset: 2px; color: inherit; }

.row { display: flex; align-items: flex-start; gap: var(--sp-4); min-height: var(--row-h); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); cursor: pointer; position: relative; }
.row:hover { background: var(--bg-hover); }
.row-main { flex: 1; min-width: 0; }
.row-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: var(--lh-tight); padding-top: 1px; }
.row-s { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; overflow: hidden; margin-top: 3px; }
.row-s span { overflow: hidden; text-overflow: ellipsis; }
.row-s .dot { width: 6px; height: 6px; }
.row-m { flex: none; font-size: var(--fs-xs); color: var(--ink-3); padding-top: 1px; font-variant-numeric: tabular-nums; }
.row-m.late { color: var(--late); }
.row.done .row-t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.row.note .row-t { font-weight: var(--fw-med); }
.ico-doc { width: var(--cb); height: 17px; flex: none; margin-top: 0; border: 1.5px solid var(--ink-3); border-radius: 3px; position: relative; }
.ico-doc::after { content: ""; position: absolute; left: 3px; right: 3px; top: 4px; height: 5px; border-top: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); }
.cb { width: var(--cb); height: var(--cb); flex: none; margin-top: 1px; border-radius: 4px; border: 1.5px solid var(--ink-3); display: grid; place-items: center; }
.cb:hover { border-color: var(--accent); }
.cb.on { background: var(--accent); border-color: var(--accent); }
.cb.on::after { content: ""; width: 7px; height: 4px; border-left: 1.8px solid var(--accent-ink); border-bottom: 1.8px solid var(--accent-ink); transform: translateY(-1px) rotate(-45deg); }

.home { flex: 1; overflow: auto; padding: var(--sp-6) var(--sp-7) var(--sp-8); }
.home-head { display: flex; align-items: flex-end; gap: var(--sp-7); margin-bottom: var(--sp-6); }
.home-head h1 { margin: 0; font-size: var(--fs-xl); font-weight: var(--fw-bold); letter-spacing: -.015em; line-height: var(--lh-tight); }
.home-head .sub { margin: 3px 0 0; color: var(--ink-2); font-size: var(--fs-sm); }
.home-head .sub b { font-weight: var(--fw-med); color: var(--ink); }
.home-head .sub .late { color: var(--late); }
.loadbox { margin-left: auto; display: flex; align-items: flex-end; gap: var(--sp-5); }
.load { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
.load-d { width: 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: var(--fs-2xs); color: var(--ink-3); }
.load-d i { width: 8px; border-radius: 2px; background: color-mix(in srgb, var(--ink-3) 45%, transparent); min-height: 2px; }
.load-d.t i { background: var(--accent); } .load-d.t { color: var(--accent); font-weight: var(--fw-bold); }
.load-d.we { opacity: .65; }
.load-cap { font-size: var(--fs-2xs); color: var(--ink-3); text-align: right; margin-bottom: 15px; line-height: 1.2; }

.sec-h { display: flex; align-items: baseline; gap: var(--sp-4); font-size: var(--fs-2xs); font-weight: var(--fw-bold); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 var(--sp-4); }
.sec-h em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; }
.ptiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-7); }
.ptile { text-align: left; padding: var(--sp-4) var(--sp-5) var(--sp-5); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg-raised); display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.ptile:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.pt-h { display: flex; align-items: center; gap: var(--sp-3); font-weight: var(--fw-med); white-space: nowrap; }
.pt-h b { font-weight: var(--fw-med); overflow: hidden; text-overflow: ellipsis; }
.pt-h span { margin-left: auto; font-size: var(--fs-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--pc) 10%, var(--bg-sunk)); gap: 1px; }
.pbar i { display: block; height: 100%; }
.pbar .s-done { background: var(--pc); }
.pbar .s-today { background: color-mix(in srgb, var(--pc) 62%, transparent); }
.pbar .s-week { background: color-mix(in srgb, var(--pc) 38%, transparent); }
.pbar .s-later { background: color-mix(in srgb, var(--pc) 20%, transparent); }
.pt-s { font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-s b { color: var(--ink-2); font-weight: var(--fw-med); }

.lanes { border-top: 1px solid var(--line); }
.lane { display: grid; grid-template-columns: var(--lane-label-w) minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.lane-l { padding: var(--sp-5) var(--sp-5) var(--sp-5) 0; display: flex; flex-direction: column; gap: 2px; position: relative; }
.lane-l b { font-size: var(--fs-lg); font-weight: var(--fw-bold); letter-spacing: -.01em; display: flex; align-items: baseline; gap: var(--sp-3); }
.lane-l b span { font-size: var(--fs-sm); font-weight: var(--fw-med); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.lane-l small { font-size: var(--fs-xs); color: var(--ink-3); }
.lane-today .lane-l b { color: var(--accent); }
.lane-today .lane-l::before { content: ""; position: absolute; left: -12px; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: var(--accent); }
.lane-c { padding: var(--sp-4) 0; min-width: 0; }
.today-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 var(--sp-5); border-radius: var(--r-md); }
.cols { display: grid; gap: 0; }
.days { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.buckets { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.col { min-width: 0; padding: 0 var(--sp-3); border-left: 1px solid var(--line); border-radius: 0; min-height: 76px; }
.col:first-child { border-left: 0; padding-left: 0; }
.col-h { display: flex; align-items: baseline; gap: var(--sp-3); padding: var(--sp-2) var(--sp-4) var(--sp-3); font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
.col-h b { font-size: var(--fs-md); color: var(--ink-2); font-weight: var(--fw-med); }
.col-h .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.col.we .col-h b { color: var(--ink-3); }
.col .row { padding-left: var(--sp-4); }
.empty { font-size: var(--fs-xs); color: var(--ink-3); padding: var(--sp-3) var(--sp-4); }
.filterline { font-size: var(--fs-sm); color: var(--ink-2); margin: calc(-1 * var(--sp-4)) 0 var(--sp-5); }
.filterline button { color: var(--accent); }

.notes { flex: 1; display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr); min-height: 0; }
.list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.list-h { flex: none; display: flex; align-items: baseline; gap: var(--sp-4); padding: var(--sp-5) var(--sp-6) var(--sp-4); border-bottom: 1px solid var(--line); }
.list-h b { font-size: var(--fs-lg); font-weight: var(--fw-bold); }
.list-h span { font-size: var(--fs-xs); color: var(--ink-3); }
.list-h .sort { margin-left: auto; font-size: var(--fs-xs); color: var(--ink-3); }
.list-b { flex: 1; overflow: auto; }
.nrow { padding: var(--sp-4) var(--sp-6) var(--sp-4) var(--sp-6); border-bottom: 1px solid var(--line); cursor: pointer; position: relative; }
.nrow:hover { background: var(--bg-hover); }
.nrow.on { background: var(--bg-sel); }
.nrow.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.n1 { display: flex; align-items: baseline; gap: var(--sp-4); }
.n1 .t { flex: 1; min-width: 0; font-weight: var(--fw-med); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n1 .d { font-size: var(--fs-xs); color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; }
.n2 { display: flex; align-items: center; gap: var(--sp-3); margin-top: 2px; font-size: var(--fs-sm); color: var(--ink-3); }
.n2 .s { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.n2 .dot { width: 6px; height: 6px; }
.prog { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); flex: none; font-variant-numeric: tabular-nums; }
.prog i { width: 22px; height: 4px; border-radius: 2px; background: var(--line-strong); overflow: hidden; display: block; }
.prog i b { display: block; height: 100%; background: var(--accent); }
mark { background: var(--mark-bg); color: inherit; border-radius: 2px; }

.editor { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.ed-bar { flex: none; display: flex; align-items: center; gap: var(--sp-4); height: 44px; padding: 0 var(--sp-6) 0 var(--sp-7); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--ink-3); white-space: nowrap; }
.pchip { display: inline-flex; align-items: center; gap: var(--sp-3); height: 22px; padding: 0 var(--sp-4); border-radius: var(--r-pill); background: var(--bg-sunk); color: var(--ink-2); font-size: var(--fs-xs); font-weight: var(--fw-med); }
.pchip .dot { width: 6px; height: 6px; }
.ed-scroll { flex: 1; overflow: auto; }
.doc { max-width: var(--doc-w); margin: 0 auto; padding: var(--sp-7) var(--sp-8) 80px; font-size: var(--fs-lg); line-height: 1.6; }
.doc [contenteditable] { outline: none; }
.d-title { font-size: var(--fs-2xl); font-weight: var(--fw-bold); letter-spacing: -.02em; line-height: var(--lh-tight); margin: 0 0 var(--sp-4); }
.d-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-7); font-size: var(--fs-xs); color: var(--ink-3); }
.tag { height: 20px; display: inline-flex; align-items: center; padding: 0 var(--sp-4); border-radius: var(--r-pill); border: 1px solid var(--line); color: var(--ink-2); }
.doc h2 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: var(--sp-6) 0 var(--sp-3); font-weight: var(--fw-bold); }
.doc p { margin: 0 0 var(--sp-5); }
.doc ul { margin: 0 0 var(--sp-5); padding-left: 22px; }
.wl { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); cursor: pointer; }
.wl::before { content: "↗ "; font-size: .8em; }
.checklist { margin: 0 0 var(--sp-6); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.ck { display: flex; align-items: center; gap: var(--sp-5); padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); font-size: var(--fs-lg); }
.ck:first-child { border-top: 0; }
.ck .cb { margin-top: 0; }
.ck-t { flex: 1; min-width: 0; }
.ck.done .ck-t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.due { height: 22px; padding: 0 var(--sp-4); border-radius: var(--r-pill); font-size: var(--fs-xs); color: var(--ink-2); background: var(--bg-sunk); white-space: nowrap; font-variant-numeric: tabular-nums; }
.due.today { background: var(--accent-soft); color: var(--accent); font-weight: var(--fw-med); }
.due.late { color: var(--late); background: color-mix(in srgb, var(--late) 10%, transparent); font-weight: var(--fw-med); }
.due.none { color: var(--ink-3); background: none; border: 1px dashed var(--line-strong); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: var(--mark-bg); } 100% { background: transparent; } }
.backlinks { border-top: 1px solid var(--line); margin-top: var(--sp-8); padding-top: var(--sp-5); font-size: var(--fs-md); }
.backlinks .row { margin: 0 calc(-1 * var(--sp-4)); }

.ai-strip { display: flex; align-items: center; gap: var(--sp-4); margin: 0 0 var(--sp-6); padding: var(--sp-4) var(--sp-5); border-radius: var(--r-lg); background: var(--bg-sunk); font-size: var(--fs-sm); color: var(--ink-2); }
.ai-strip b { color: var(--ink); font-weight: var(--fw-med); }
.ai-strip .cost { color: var(--ink-3); font-size: var(--fs-xs); margin-top: 1px; }
.ai-l { min-width: 0; }
.chg { position: relative; margin: 0 0 var(--sp-5); padding: var(--sp-4) var(--sp-5); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg-raised); }
.chg-body { line-height: 1.65; }

const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const [Y, M, DD] = D.today.split("-").map(Number);
const day = (n) => new Date(Y, M - 1, DD + n);
const isWe = (n) => [0, 6].includes(day(n).getDay());
const dShort = (n) => `${WD[day(n).getDay()]} ${day(n).getDate()}`;
const dLong = (n) => `${day(n).getDate()} ${MO[day(n).getMonth()]}`;
const dueLabel = (n) => n == null ? "No date" : n < 0 ? `${-n}d late` : n === 0 ? "Today" : n === 1 ? "Tomorrow" : n <= 6 ? dShort(n) : dLong(n);
const dueCls = (n) => n == null ? "none" : n < 0 ? "late" : n === 0 ? "today" : "";
const NOW_MIN = D.now.split(":").reduce((h, m) => +h * 60 + +m);
function editedLabel(min) {
  const t = NOW_MIN + min;
  if (min > -60) return `${-min} min ago`;
  if (t >= 0) { const h = Math.floor(t / 60), m = t % 60; return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; }
  const back = Math.ceil(-t / 1440);
  return back === 1 ? "Yesterday" : back < 7 ? WD[day(-back).getDay()] : dLong(-back);
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inl = (c) => c.type === "text" ? c.value : (c.children || []).map((x) => x.value).join("");
const txt = (content) => (content || []).map(inl).join("");
const blockText = (b) => b.text ?? (b.content ? txt(b.content) : (b.items || []).map((i) => txt(i.content || i)).join(" · "));
const plain = (n) => n.blocks.map(blockText).join(" ");
const snippet = (n) => { const b = n.blocks.find((b) => b.type === "paragraph"); return b ? txt(b.content) : ""; };
const projOf = (n) => n.project ? prById[n.project] : null;
const nbPath = (id) => { const b = nbById[id]; return b.parent ? [nbById[b.parent].name, b.name] : [b.name]; };

function tasks() {
  const out = [];
  for (const n of D.notes) for (const b of n.blocks) if (b.task) b.items.forEach((it, i) => out.push({ k: "t", n, b, i, it, key: `${b.id}:${i}`, text: txt(it.content) }));
  return out;
}
const taskByKey = (key) => tasks().find((t) => t.key === key);
const datedNotes = () => D.notes.filter((n) => n.day != null).map((n) => ({ k: "n", n, key: n.id, text: n.title }));
const laneOf = (t) => t.it.checked ? "done" : t.it.due == null ? "none" : t.it.due <= 0 ? "today" : t.it.due <= 6 ? "week" : t.it.due <= 13 ? "next" : "later";
const boardCol = (t) => ({ done: "done", today: "today", week: "week" }[laneOf(t)] || "later");

const S = {
  view: "home", ctx: { kind: "nb", id: "fx-nb-projects" }, noteId: "fx-note-00", q: "",
  board: "all", ask: false, aiOn: true, ai: null, conflict: null, offline: false,
  mobile: false, frame: false, mpane: "list", flash: null, toast: null, state: 1,
  convo: [],
};
let undoSnap = null;

const ic = {
  home: '<svg class="i" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h7M2.5 12h4"/></svg>',
  board: '<svg class="i" viewBox="0 0 16 16"><rect x="2" y="2.5" width="3.2" height="11" rx="1"/><rect x="6.4" y="2.5" width="3.2" height="7" rx="1"/><rect x="10.8" y="2.5" width="3.2" height="9" rx="1"/></svg>',
  notes: '<svg class="i" viewBox="0 0 16 16"><path d="M4 1.8h5.5L12.5 5v9.2H4z"/><path d="M6.2 8h4M6.2 10.6h4"/></svg>',
  book: '<svg class="i" viewBox="0 0 16 16"><path d="M3.5 2.5h8.5v11H3.5z"/><path d="M5.8 2.5v11"/></svg>',
  inbox: '<svg class="i" viewBox="0 0 16 16"><path d="M2.5 9l1.8-6h7.4l1.8 6v4.5h-11z"/><path d="M2.5 9h3.2l.8 1.6h3l.8-1.6h3.2"/></svg>',
  back: '<svg class="i" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>',
  close: '<svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  spark: '<span aria-hidden="true">✨</span>',
};
function hl(s) {
  const e = esc(s);
  if (!S.q) return e;
  const q = S.q.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return q ? e.replace(new RegExp(`(${q})`, "ig"), "<mark>$1</mark>") : e;
}
const matchQ = (n, extra = "") => !S.q || (n.title + " " + plain(n) + " " + extra).toLowerCase().includes(S.q.trim().toLowerCase());
function ctxNotes(ctx = S.ctx) {
  let list = D.notes;
  if (ctx.kind === "nb") list = list.filter((n) => n.nb === ctx.id || nbById[n.nb].parent === ctx.id);
  if (ctx.kind === "project") list = list.filter((n) => n.project === ctx.id);
  return list.filter((n) => matchQ(n)).slice().sort((a, b) => b.edited - a.edited);
}
const ctxName = (ctx) => ctx.kind === "all" ? "All notes" : ctx.kind === "project" ? prById[ctx.id].name : nbById[ctx.id].name;
function projectStats(pid) {
  const ts = tasks().filter((t) => t.n.project === pid);
  const c = { done: 0, today: 0, week: 0, later: 0 };
  ts.forEach((t) => c[boardCol(t)]++);
  const open = ts.filter((t) => !t.it.checked).sort((a, b) => (a.it.due ?? 999) - (b.it.due ?? 999));
  return { total: ts.length, ...c, next: open[0], notes: D.notes.filter((n) => n.project === pid).length };
}
function pbar(st, pc) {
  if (!st.total) return `<div class="pbar pc${pc}"></div>`;
  const w = (n) => `${(n / st.total) * 100}%`;
  return `<div class="pbar pc${pc}"><i class="s-done" style="width:${w(st.done)}"></i><i class="s-today" style="width:${w(st.today)}"></i><i class="s-week" style="width:${w(st.week)}"></i><i class="s-later" style="width:${w(st.later)}"></i></div>`;
}

function taskRow(t, { meta = "due", cls = "" } = {}) {
  const p = projOf(t.n), d = t.it.due;
  let m = "";
  if (t.it.checked) m = t.it.done != null ? dueLabel(t.it.done).replace("late", "ago") : "";
  else if (meta === "due") m = d != null && d !== 0 ? dueLabel(d) : "";
  else if (meta === "late" && d != null && d < 0) m = dueLabel(d);
  const late = !t.it.checked && d != null && d < 0;
  return `<div class="row task ${t.it.checked ? "done" : ""} ${cls}" data-open="${t.n.id}" data-line="${t.key}">
    <button class="cb ${t.it.checked ? "on" : ""}" data-tick="${t.key}" aria-label="Done"></button>
    <div class="row-main"><div class="row-t">${hl(t.text)}</div><div class="row-s">${p ? `<i class="dot pc${p.hue}"></i>` : ""}<span>${hl(t.n.title)}</span></div></div>
    ${m ? `<span class="row-m ${late ? "late" : ""}">${m}</span>` : ""}</div>`;
}
function noteRow(n, meta = "") {
  const p = projOf(n);
  return `<div class="row note" data-open="${n.id}">
    <span class="ico-doc"></span>
    <div class="row-main"><div class="row-t">${hl(n.title)}</div><div class="row-s">${p ? `<i class="dot pc${p.hue}"></i>` : ""}<span>${esc(nbPath(n.nb).at(-1))} · ${esc(snippet(n))}</span></div></div>
    ${meta ? `<span class="row-m">${meta}</span>` : ""}</div>`;
}

function renderSide() {
  const open = tasks().filter((t) => !t.it.checked);
  const todayN = open.filter((t) => t.it.due != null && t.it.due <= 0).length + D.notes.filter((n) => n.day === 0).length;
  const on = (v, extra = true) => S.view === v && extra ? "on" : "";
  const nbCount = (id) => D.notes.filter((n) => n.nb === id || nbById[n.nb].parent === id).length;
  const nbs = D.notebooks.filter((b) => !b.parent).flatMap((b) => [b, ...D.notebooks.filter((c) => c.parent === b.id)]);
  const pend = S.offline ? 3 : 0;
  return `
  <div class="brand"><span class="brand-mark"></span>Barkever</div>
  <div class="nav">
    <button class="nav-i ${on("home")}" data-nav="home">${ic.home}<span class="lbl">Home</span><span class="n">${todayN} today</span></button>
    <button class="nav-i ${on("board", S.board === "all")}" data-nav="board">${ic.board}<span class="lbl">Board</span><span class="n">${open.length}</span></button>
    <button class="nav-i ${on("notes", S.ctx.kind === "all")}" data-ctx="all">${ic.notes}<span class="lbl">All notes</span><span class="n">${D.notes.length}</span></button>
    <div class="nav-h">Projects</div>
    ${D.projects.map((p) => { const st = projectStats(p.id); return `<button class="nav-i ${(S.view === "board" && S.board === p.id) || (S.view === "notes" && S.ctx.kind === "project" && S.ctx.id === p.id) ? "on" : ""}" data-board="${p.id}"><i class="dot pc${p.hue}"></i><span class="lbl">${esc(p.name)}</span><span class="minibar pc${p.hue}" title="${st.done}/${st.total} done"><i style="width:${st.total ? (st.done / st.total) * 100 : 0}%"></i></span></button>`; }).join("")}
    <div class="nav-h">Notebooks</div>
    ${nbs.map((b) => `<button class="nav-i ${b.parent ? "sub" : ""} ${S.view === "notes" && S.ctx.kind === "nb" && S.ctx.id === b.id ? "on" : ""}" data-nb="${b.id}">${b.id === "fx-nb-inbox" ? ic.inbox : ic.book}<span class="lbl">${esc(b.name)}</span><span class="n">${nbCount(b.id)}</span></button>`).join("")}
  </div>
  <div class="sync ${S.offline ? "off" : ""}"><i class="dot"></i>${S.offline ? `Offline · ${pend} changes waiting` : "Synced · just now"}</div>`;
}

function renderHome() {
  const all = tasks().filter((t) => matchQ(t.n, t.text));
  const open = all.filter((t) => !t.it.checked);
  const notes = datedNotes().filter((x) => matchQ(x.n));
  const by = (lane) => open.filter((t) => laneOf(t) === lane).sort((a, b) => a.it.due - b.it.due);
  const today = by("today").sort((a, b) => a.it.due - b.it.due || (a.n.project || "").localeCompare(b.n.project || ""));
  const todayNotes = notes.filter((x) => x.n.day <= 0);
  const late = today.filter((t) => t.it.due < 0).length;
  const week = by("week"), weekNotes = notes.filter((x) => x.n.day >= 1 && x.n.day <= 6);
  const nextW = [...by("next")], laterW = [...by("later")], none = by("none");
  const doneToday = all.filter((t) => t.it.checked && t.it.done === 0).length;

  const load = Array.from({ length: 14 }, (_, d) => open.filter((t) => t.it.due != null && (d === 0 ? t.it.due <= 0 : t.it.due === d)).length + notes.filter((x) => x.n.day === d).length);
  const max = Math.max(4, ...load);
  const loadHtml = `<div class="loadbox"><div class="load-cap">Next<br>14 days</div><div class="load" title="Open items per day">${load.map((n, d) => `<div class="load-d ${d === 0 ? "t" : ""} ${isWe(d) ? "we" : ""}" title="${dShort(d)}: ${n} open"><i style="height:${Math.max(2, (n / max) * 26)}px"></i>${WD[day(d).getDay()][0]}</div>`).join("")}</div></div>`;

  const tiles = D.projects.map((p) => {
    const st = projectStats(p.id);
    const nx = st.next ? `next <b>${esc(st.next.text)}</b> · ${dueLabel(st.next.it.due)}` : st.total ? "all done" : "no checklists yet";
    return `<button class="ptile" data-board="${p.id}"><div class="pt-h"><i class="dot pc${p.hue}"></i><b>${esc(p.name)}</b><span>${st.done}/${st.total}</span></div>${pbar(st, p.hue)}<div class="pt-s">${nx}</div></button>`;
  }).join("");

  const col = (title, sub, items, cls = "") => `<div class="col ${cls} ${items.length ? "" : "empty-col"}"><div class="col-h"><b>${title}</b>${sub}<span class="n">${items.length || ""}</span></div>${items.join("") || `<div class="empty">—</div>`}</div>`;
  const days = Array.from({ length: 6 }, (_, i) => i + 1).map((d) => col(WD[day(d).getDay()], `<span>${day(d).getDate()}</span>`, [...week.filter((t) => t.it.due === d).map((t) => taskRow(t, { meta: "" })), ...weekNotes.filter((x) => x.n.day === d).map((x) => noteRow(x.n))], isWe(d) ? "we" : "")).join("");
  const notesLater = notes.filter((x) => x.n.day > 6);
  const buckets = [
    col("Next week", `<span>${dLong(7)}–${dLong(13)}</span>`, [...nextW.map((t) => taskRow(t)), ...notesLater.filter((x) => x.n.day <= 13).map((x) => noteRow(x.n, dueLabel(x.n.day)))]),
    col("Later", `<span>from ${dLong(14)}</span>`, [...laterW.map((t) => taskRow(t)), ...notesLater.filter((x) => x.n.day > 13).map((x) => noteRow(x.n, dueLabel(x.n.day)))]),
    col("No date", "", none.map((t) => taskRow(t))),
  ].join("");
  const qn = S.q ? D.notes.filter((n) => matchQ(n)).length : 0;
  const weekN = week.length + weekNotes.length, laterN = nextW.length + laterW.length + none.length + notesLater.length;

  return `<div class="home" data-keep="home">
    <div class="home-head"><div><h1>${WD[day(0).getDay()].replace("Thu", "Thursday")} ${dLong(0).replace("Oct", "October")}</h1>
      <p class="sub"><b>${today.length + todayNotes.length}</b> for today${late ? ` · <span class="late">${late} late</span>` : ""} · <b>${weekN}</b> this week · <b>${doneToday}</b> done today</p></div>${loadHtml}</div>
    ${S.q ? `<div class="filterline">Lanes filtered by “${esc(S.q)}” · ${qn} matching notes · <button data-act="q-list">open as list</button> · <button data-act="q-clear">clear</button></div>` : ""}
    <div class="sec-h">Projects <em>· click for its board</em></div>
    <div class="ptiles">${tiles}</div>
    <div class="lanes">
      <div class="lane lane-today"><div class="lane-l"><b>Today <span>${today.length + todayNotes.length}</span></b><small>${dShort(0)} ${MO[day(0).getMonth()]}</small></div>
        <div class="lane-c"><div class="today-grid">${[...today.map((t) => taskRow(t, { meta: "late" })), ...todayNotes.map((x) => noteRow(x.n, "note"))].join("")}</div></div></div>
      <div class="lane"><div class="lane-l"><b>This week <span>${weekN}</span></b><small>${dLong(1)} – ${dLong(6)}</small></div><div class="lane-c cols days">${days}</div></div>
      <div class="lane"><div class="lane-l"><b>Later <span>${laterN}</span></b><small>from ${dLong(7)}</small></div><div class="lane-c cols buckets">${buckets}</div></div>
    </div></div>`;
}

const COLS = [["later", "Later"], ["week", "This week"], ["today", "Today"], ["done", "Done"]];
function renderBoard() {
  const all = tasks().filter((t) => matchQ(t.n, t.text));
  const pills = `<div class="pills"><button class="pill ${S.board === "all" ? "on" : ""}" data-board="all">All projects</button>${D.projects.map((p) => `<button class="pill ${S.board === p.id ? "on" : ""}" data-board="${p.id}"><i class="dot pc${p.hue}"></i>${esc(p.name)}</button>`).join("")}</div>`;
  const cell = (ts, c, limitDone = true) => {
    let items = ts.filter((t) => boardCol(t) === c).sort((a, b) => (a.it.due ?? 99) - (b.it.due ?? 99));
    let more = "";
    if (c === "done" && limitDone && items.length > 3) { more = `<div class="more">+${items.length - 3} more done</div>`; items = items.slice(0, 3); }
    return items.map((t) => taskRow(t, { cls: "card" })).join("") + more;
  };
  const head = (ts) => COLS.map(([c, l]) => `<div class="bh c-${c}">${l} <span>${ts.filter((t) => boardCol(t) === c).length}</span></div>`).join("");
  if (S.board === "all") {
    const rows = D.projects.map((p) => {
      const ts = all.filter((t) => t.n.project === p.id), st = projectStats(p.id);
      return `<div class="bl pc${p.hue}"><b data-board="${p.id}"><i class="dot"></i>${esc(p.name)}</b>${pbar(st, p.hue)}<small>${st.done}/${st.total} done · ${st.notes} notes</small></div>` +
        COLS.map(([c]) => `<div class="bc c-${c}">${cell(ts, c)}</div>`).join("");
    }).join("");
    return `<div class="board" data-keep="board"><div class="board-head"><h1>Board</h1>${pills}<span class="hint">Each card is a checklist line in a note · tick to finish</span></div>
      <div class="bgrid" style="grid-template-columns: 168px repeat(4, minmax(0, 1fr))"><div class="bh"></div>${head(all)}${rows}</div></div>`;
  }
  const p = prById[S.board], ts = all.filter((t) => t.n.project === p.id), st = projectStats(p.id);
  const pn = D.notes.filter((n) => n.project === p.id).sort((a, b) => b.edited - a.edited);
  return `<div class="board" data-keep="board"><div class="board-head"><h1>${esc(p.name)}</h1>${pills}<span class="hint">${st.done}/${st.total} done</span></div>
    <div class="single">${head(ts)}<div class="bh" style="border-left:1px solid var(--line)">Notes <span>${pn.length}</span></div>
    ${COLS.map(([c]) => `<div class="bc c-${c}">${cell(ts, c, false) || `<div class="empty">${c === "later" && !st.total ? "Type [ ] in a project note to add a task" : "—"}</div>`}</div>`).join("")}
    <div class="pnotes">${pn.map((n) => noteRow(n, editedLabel(n.edited))).join("")}<button class="btn sm" data-ctx-project="${p.id}" style="margin:6px 4px">Open as list →</button></div></div></div>`;
}

function renderNotes() {
  const list = ctxNotes();
  if (!list.find((n) => n.id === S.noteId) && list[0] && !S.conflict) S.noteId = list[0].id;
  const rows = list.map((n) => {
    const p = projOf(n);
    const ts = n.blocks.filter((b) => b.task).flatMap((b) => b.items);
    const done = ts.filter((i) => i.checked).length;
    const prog = ts.length ? `<span class="prog"><i><b style="width:${(done / ts.length) * 100}%"></b></i>${done}/${ts.length}</span>` : "";
    return `<div class="nrow ${n.id === S.noteId ? "on" : ""}" data-note="${n.id}"><div class="n1"><span class="t">${hl(n.title || "Untitled")}</span><span class="d">${editedLabel(n.edited)}</span></div>
      <div class="n2">${p ? `<i class="dot pc${p.hue}"></i>` : ""}<span class="s">${hl(snippet(n))}</span>${prog}</div></div>`;
  }).join("") || `<div class="empty" style="padding:16px 24px">No notes match “${esc(S.q)}”. Clear the search to see all.</div>`;
  const back = `<button class="btn back" data-act="mback">${ic.back}</button>`;
  return `<div class="notes ${S.mpane === "editor" ? "ed" : ""}">
    <section class="list"><div class="list-h"><b>${esc(ctxName(S.ctx))}</b><span>${list.length} notes</span><span class="sort">Edited ↓</span></div><div class="list-b" data-keep="list">${rows}</div></section>
    <section class="editor">${S.conflict ? renderConflict(back) : renderEditor(back)}</section></div>`;
}

function inlineHtml(content) {
  return content.map((c) => c.type === "wikilink" ? `<a class="wl" contenteditable="false" data-link="${c.docId || c.target}">${esc(inl(c))}</a>` : esc(c.value)).join("");
}
function renderEditor(back) {
  const n = byId[S.noteId];
  if (!n) return `<div class="empty" style="margin:auto">Pick a note on the left, or press N for a new one.</div>`;
  const p = projOf(n);
  const ai = S.ai && S.ai.noteId === n.id ? S.ai : null;
  const chg = (id) => ai && ai.changes.find((c) => c.target === id);
  const blocks = n.blocks.map((b) => {
    if (b.type === "heading") return `<h2 id="blk-${b.id}">${esc(b.text)}</h2>`;
    if (b.type === "paragraph") { const c = chg(b.id); return c ? changeCard(c) : `<p id="blk-${b.id}" contenteditable="true" data-para="${b.id}">${inlineHtml(b.content)}</p>`; }
    if (b.type === "list" && b.task) {
      return `<div class="checklist" id="blk-${b.id}">${b.items.map((it, i) => {
        const key = `${b.id}:${i}`, c = chg(key);
        if (c) return `<div style="padding:8px 8px 0">${changeCard(c, it)}</div>`;
        const d = it.due;
        const dueBtn = it.checked ? `<span class="due">${it.done != null ? "done " + dueLabel(it.done).replace(" late", " ago").replace("Today", "today") : "done"}</span>` : `<span class="due ${dueCls(d)}">${dueLabel(d)}</span>`;
        return `<div class="ck ${it.checked ? "done" : ""}" id="line-${key.replace(":", "-")}"><button class="cb ${it.checked ? "on" : ""}" data-tick="${key}" aria-label="Done"></button><span class="ck-t" contenteditable="true" data-item="${key}">${inlineHtml(it.content)}</span>${dueBtn}</div>`;
      }).join("")}</div>`;
    }
    if (b.type === "list") return `<ul id="blk-${b.id}">${b.items.map((it) => `<li>${inlineHtml(it.content || it)}</li>`).join("")}</ul>`;
    return "";
  }).join("");
  const backs = D.notes.filter((o) => o.links.includes(n.id));
  const aiStrip = ai ? (() => {
    const pend = ai.changes.filter((c) => c.status === "pending").length, acc = ai.changes.filter((c) => c.status === "accepted").length;
    return `<div class="ai-strip"><div class="ai-l"><b>${ic.spark} AI Edit</b> “${esc(ai.prompt)}”<div class="cost">${ai.changes.length} changes${pend ? ` · ${pend} to review` : ""} · Claude, your login · ≈0.3¢</div></div><span class="grow"></span>
      <button class="btn sm line" data-act="ai-all-no">Reject all</button><button class="btn sm line" data-act="ai-all-ok">Accept all</button><button class="btn sm primary" data-act="ai-done">${acc ? `Apply ${acc}` : "Close"}</button></div>`;
  })() : "";

const STOP = new Set("a an and are as at be by did do does for from has have how i in is it my of on or our say said the to was we what when where which who why with about you your me can there any".split(" "));
const terms = (s) => s.toLowerCase().match(/[a-zæøå0-9]+/g)?.filter((w) => w.length > 2 && !STOP.has(w)).map((w) => w.replace(/(ing|es|s)$/, "")) ?? [];
function retrieve(q) {
  const qs = [...new Set(terms(q))];
  if (!qs.length) return [];
  const hits = [];
  for (const n of D.notes) for (const b of n.blocks) {
    if (b.type === "heading") continue;
    const t = b.type === "paragraph" ? txt(b.content) : blockText(b);
    if (/^See /.test(t)) continue;
    const words = new Set([...terms(t), ...terms(n.title)]);
    const score = qs.filter((w) => words.has(w)).length + qs.filter((w) => terms(t).includes(w)).length * 0.5;
    if (score) hits.push({ n, b, t, score });
  }
  return hits.sort((a, b) => b.score - a.score).filter((h, i, arr) => h.score >= Math.max(1.5, arr[0].score * 0.6) && i < 3);
}
function answer(q) {

  if (!hits.length) return { q, none: true, text: "Nothing in your notes answers this. I looked at titles and text in all 50 notes.", cites: [] };
  return { q, text: "From your notes:", lines: hits.map((h, i) => ({ s: h.t, c: [i + 1] })), cites: hits.map((h) => ({ id: h.n.id, blk: h.b.id, quote: h.t })) };
}

  }
  if ((x = at("[data-board]"))) return go({ view: "board", board: x.dataset.board });
  if ((x = at("[data-ctx-project]"))) return go({ view: "notes", ctx: { kind: "project", id: x.dataset.ctxProject }, mpane: "list" });
  if ((x = at("[data-nav]"))) return go({ view: x.dataset.nav, board: "all" });
  if ((x = at("[data-ctx]"))) return go({ view: "notes", ctx: { kind: "all" }, mpane: "list" });
  if ((x = at("[data-nb]"))) return go({ view: "notes", ctx: { kind: "nb", id: x.dataset.nb }, mpane: "list" });
  if ((x = at("[data-note]"))) return selectNote(x.dataset.note);
  if ((x = at("[data-open]")) && !at("[contenteditable=true]")) return openNote(x.dataset.open, x.dataset.line);
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("#askq").value.trim();
  if (!q) return;
  S.convo.push(answer(q));
  render();
  $(".ask-b").scrollTop = 1e6;
  $("#askq").focus();
});

$("#q").addEventListener("input", (e) => { S.q = e.target.value; S.state = 0; render(); });
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && S.view !== "notes") go({ view: "notes", ctx: { kind: "all" }, mpane: "list" });
  if (e.key === "Escape") { S.q = e.target.value = ""; e.target.blur(); render(); }
});

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, [contenteditable=true]")) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (/^[1-8]$/.test(e.key) && !e.metaKey && !e.ctrlKey) return applyState(+e.key);
  if (e.key === "Escape") { if (S.ask) S.ask = false; else S.ai = null; return render(); }
  if (S.view !== "notes" || !["ArrowDown", "ArrowUp"].includes(e.key)) return;
  e.preventDefault();
  const list = ctxNotes();
  const i = list.findIndex((n) => n.id === S.noteId) + (e.key === "ArrowDown" ? 1 : -1);
  const next = list[Math.max(0, Math.min(list.length - 1, i))];
  if (next) selectNote(next.id);
});

document.addEventListener("input", (e) => {
  const t = e.target, n = byId[S.noteId];
  if (!n || !t.isContentEditable) return;
  if (t.dataset.title) n.title = t.textContent;
  if (t.dataset.para) n.blocks.find((b) => b.id === t.dataset.para).content = domInline(t);
  if (t.dataset.item) taskByKey(t.dataset.item).it.content = [{ type: "text", value: t.textContent }];
  n.edited = 0;
  const row = $(`.nrow[data-note="${n.id}"]`);
  if (!row) return;
  $(".t", row).textContent = n.title || "Untitled";
  $(".s", row).textContent = snippet(n);
  $(".d", row).textContent = "just now";
});

const domInline = (el) => [...el.childNodes].map((nd) => nd.dataset?.link
  ? { type: "wikilink", target: nd.dataset.link, docId: nd.dataset.link, children: [{ type: "text", value: nd.textContent }] }
  : { type: "text", value: nd.textContent });

window.addEventListener("popstate", () => { Object.assign(S, parseRoute(location.hash), { state: 0 }); render(); });
window.addEventListener("resize", () => {
  if (S.frame || S.mobile === innerWidth < 600) return;
  S.mobile = innerWidth < 600;
  render();
});

S.theme = new URLSearchParams(location.search).get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const preset = location.hash.match(/s=(\d)/);
if (preset) applyState(+preset[1]);
else {
  if (location.hash.startsWith("#/")) Object.assign(S, parseRoute(location.hash), { state: 0 });
  S.mobile = innerWidth < 600;
  history.replaceState(null, "", route());
  render();
}
</script>
</body>
</html>
