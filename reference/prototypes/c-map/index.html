<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const RAW = JSON.parse($("#fixtures").textContent);
const NB = RAW.filter((d) => d._type === "notebook");
const NOTES = RAW.filter((d) => d._type === "note");
const byId = Object.fromEntries(NOTES.map((n) => [n._id, n]));
const nbById = Object.fromEntries(NB.map((n) => [n._id, n]));
const nbColor = (id) => `var(--nb-${id.replace("fx-nb-", "")})`;
const nbChildren = (id) => NB.filter((n) => n.parent?._ref === id).map((n) => n._id);
const nbScope = (id) => [id, ...nbChildren(id)];
const nbPath = (id) => { const nb = nbById[id]; return nb.parent ? [nbById[nb.parent._ref].name, nb.name] : [nb.name]; };

const NOW = new Date("2026-10-29T10:00:00");
NOTES.forEach((n, i) => { n._updated = new Date(+NOW - (((i * 17) % 50) * 7.3 + 0.3) * 3600e3); });
let touchN = 0;
const touch = (n) => { n._updated = new Date(+NOW + ++touchN * 60e3); };
function fmtDate(d) {
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const diff = Math.round((day(NOW) - day(d)) / 864e5);
  if (diff <= 0) return d.toTimeString().slice(0, 5);
  if (diff === 1) return "Yesterday";
  if (diff < 7) return d.toLocaleDateString("en-GB", { weekday: "short" });
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

const itemContent = (it) => (Array.isArray(it) ? it : it.content);
const inlineText = (c) => (c || []).map((x) => (x.type === "text" ? x.value : x.type === "wikilink" ? x.children.map((y) => y.value).join("") : "")).join("");
const blockText = (b) => (b.type === "heading" ? b.text : b.type === "paragraph" ? inlineText(b.content) : b.type === "list" ? b.items.map((it) => inlineText(itemContent(it))).join(" · ") : "");
const noteText = (n) => n.body.blocks.map(blockText).join(" ");
const sentences = (n) => n.body.blocks.filter((b) => b.type === "paragraph").flatMap((b) => inlineText(b.content).split(/(?<=[.?!])\s+/)).filter(Boolean);
const snippet = (n) => { const b = n.body.blocks.find((b) => b.type === "paragraph" && inlineText(b.content).trim()); return b ? inlineText(b.content) : "No text yet"; };
const matches = (n, q) => { const t = (n.title + " " + noteText(n) + " " + n.tags.join(" ")).toLowerCase(); return q.toLowerCase().split(/\s+/).filter(Boolean).every((x) => t.includes(x)); };

const outs = (id) => [...new Set((byId[id]?.links || []).map((l) => l._ref).filter((r) => byId[r] && r !== id))];
const backs = (id) => NOTES.filter((n) => n._id !== id && n.links.some((l) => l._ref === id)).map((n) => n._id);
const nbrs = (id) => [...new Set([...outs(id), ...backs(id)])];
const degree = (id) => nbrs(id).length;
const linkCount = () => NOTES.reduce((s, n) => s + outs(n._id).length, 0);
function tagRelated(id, max) {
  const n = byId[id]; const skip = new Set([id, ...nbrs(id)]);
  return NOTES.filter((m) => !skip.has(m._id) && m.tags.some((t) => n.tags.includes(t)))
    .map((m) => ({ id: m._id, s: m.tags.filter((t) => n.tags.includes(t)).length + (m.notebook._ref === n.notebook._ref ? 0.5 : 0) + degree(m._id) * 0.1 }))
    .sort((a, b) => b.s - a.s).slice(0, max).map((x) => x.id);
}
function linkContext(fromId, toId) {
  const b = byId[fromId].body.blocks.find((b) => b.type === "paragraph" && b.content.some((x) => x.type === "wikilink" && x.docId === toId));
  return b ? inlineText(b.content) : "";
}
function wrapLabel(t, max, lines = 2) {
  const out = []; let cur = "";
  for (const w of t.split(/\s+/)) {
    if (!cur) cur = w; else if ((cur + " " + w).length <= max) cur += " " + w; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  const res = out.slice(0, lines).map((l) => (l.length > max ? l.slice(0, max - 1) + "…" : l));
  if (out.length > lines) res[lines - 1] = res[lines - 1].slice(0, max - 1) + "…";
  return res;
}

const S = {
  nb: "all", noteId: "fx-note-01", query: "", rail: "links", view: "notes",
  map: false, mapSel: null, mapHov: null, mapQ: "", vb: null,
  offline: false, pending: 0, conflict: null, ai: null,
  ask: [], aiOn: true, forced: false, mv: "note", tipId: null, stateN: 0,
};
const isMobile = () => S.forced || matchMedia("(max-width: 700px)").matches;

const ICON = {
  notes: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="2.5" width="10" height="11" rx="1.5"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3"/></svg>',
  tasks: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3" width="4" height="4" rx="1"/><path d="M9 5h4.5M9 11h4.5"/><rect x="2.5" y="9" width="4" height="4" rx="1"/></svg>',
  map: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4" cy="5" r="2"/><circle cx="12.3" cy="4" r="1.6"/><circle cx="9" cy="12" r="2.2"/><path d="M5.6 6.4 7.7 10.2M11.8 5.5l-1.8 4.6M6 4.8l4.7-.6"/></svg>',
  link: '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="2.5" cy="6" r="1.7"/><circle cx="9.5" cy="2.7" r="1.5"/><circle cx="9.5" cy="9.3" r="1.5"/><path d="M4 5.2 8 3.3M4 6.8l4 1.9"/></svg>',
  back: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3 5 8l5 5"/></svg>',
  ask: '<span style="font-size:15px;line-height:1">✨</span>',
};

const MC = { dx: 132, dy: 76, padX: 66, padTop: 62, padBot: 50, gapX: 46, gapY: 46 };
const MAP_ROWS = [["fx-nb-home", "fx-nb-projects", "fx-nb-meetings", "fx-nb-travel"], ["fx-nb-inbox", "fx-nb-work", "fx-nb-reading"]];
let MAP;

function computeMap() {
  const boxes = {};
  for (const nb of NB) {
    const notes = NOTES.filter((n) => n.notebook._ref === nb._id);
    const cols = Math.max(2, Math.ceil(Math.sqrt(notes.length * 0.8)));
    const rows = Math.max(1, Math.ceil(notes.length / cols));
    boxes[nb._id] = { id: nb._id, notes, cols, rows, w: (cols - 1) * MC.dx + 2 * MC.padX, h: (rows - 1) * MC.dy + MC.padTop + MC.padBot };
  }
  const rowW = MAP_ROWS.map((r) => r.reduce((s, id) => s + boxes[id].w, 0) + MC.gapX * (r.length - 1));
  const W = Math.max(...rowW);
  let y = 0;
  MAP_ROWS.forEach((r, i) => {
    let x = (W - rowW[i]) / 2; const h = Math.max(...r.map((id) => boxes[id].h));
    for (const id of r) { const b = boxes[id]; b.x = x; b.y = y + (i === 0 ? h - b.h : 0); x += b.w + MC.gapX; }
    y += h + MC.gapY;
  });
  const pos = {};
  const centerOf = (b) => ({ x: b.x + b.w / 2, y: b.y + MC.padTop + (b.rows - 1) * MC.dy / 2 });
  for (const b of Object.values(boxes)) {
    const slots = [];
    for (let r = 0; r < b.rows; r++) for (let c = 0; c < b.cols; c++) slots.push({ x: b.x + MC.padX + c * MC.dx, y: b.y + MC.padTop + r * MC.dy });
    const ctr = centerOf(b);
    const order = b.notes.slice().sort((a, c) => degree(c._id) - degree(a._id) || a._id.localeCompare(c._id));
    for (const n of order) {
      let best = slots[0], bestCost = Infinity;
      for (const s of slots) {
        let cost = 0.35 * Math.hypot(s.x - ctr.x, s.y - ctr.y);
        for (const m of nbrs(n._id)) {
          const other = byId[m].notebook._ref;
          const p = pos[m] || (other !== b.id ? centerOf(boxes[other]) : null);
          if (p) cost += Math.hypot(s.x - p.x, s.y - p.y);
        }
        if (cost < bestCost) { bestCost = cost; best = s; }
      }
      pos[n._id] = best; slots.splice(slots.indexOf(best), 1);
    }
  }
  MAP = { boxes, pos, W, H: y - MC.gapY };
}

function edgePath(a, b, ra, rb) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const cx = (a.x + b.x) / 2 - dy * 0.16, cy = (a.y + b.y) / 2 + dx * 0.16;
  const unit = (px, py) => { const l = Math.hypot(cx - px, cy - py) || 1; return [(cx - px) / l, (cy - py) / l]; };
  const [sx, sy] = unit(a.x, a.y), [ex, ey] = unit(b.x, b.y);
  const f = (v) => v.toFixed(1);
  return `M${f(a.x + sx * ra)} ${f(a.y + sy * ra)}Q${f(cx)} ${f(cy)} ${f(b.x + ex * rb)} ${f(b.y + ey * rb)}`;
}

const arrow = (id, color) => `<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 .5 7.5 4 0 7.5z" style="fill:var(${color})"/></marker>`;
const arrowDefs = (p) => `<defs>${arrow(p + "a", "--c-edge")}${arrow(p + "h", "--c-accent")}${arrow(p + "p", "--c-add-fg")}</defs>`;
const mapR = (id, mini) => (mini ? 16 + Math.min(degree(id), 4) * 3 : 6 + Math.min(degree(id), 4) * 1.6);

function mapSVG(o) {
  const mini = o.mode === "mini", full = o.mode === "full", plain = mini || o.mode === "ask";
  const k = o.scale || 1, fs = 10.5 / k, p = o.prefix || "m";
  const lit = o.hov || o.sel;
  const litSet = lit && full ? new Set([lit, ...nbrs(lit)]) : null;
  const q = (o.q || "").trim();
  const hit = (n) => !q || matches(n, q);
  let s = mini ? "" : arrowDefs(p);
  for (const b of Object.values(MAP.boxes)) {
    const c = nbColor(b.id);
    s += `<g class="mb${o.focus && o.focus !== b.id ? " dim" : ""}"><rect class="mb-r" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="22" style="fill:${c};stroke:${c}"/>`;
    if (!plain) {
      const lfs = 12.5 / k;
      s += `<circle cx="${b.x + 22}" cy="${b.y + 24}" r="${4.5 / k}" style="fill:${c}"/><text class="mb-l" x="${b.x + 22 + 10 / k}" y="${b.y + 24 + lfs * 0.36}" style="font-size:${lfs}px">${esc(nbPath(b.id).join(" › "))}<tspan class="mb-n" dx="${6 / k}">${b.notes.length}</tspan></text>`;
    }
    s += `</g>`;
  }
  for (const n of NOTES) for (const t of outs(n._id)) {
    const a = MAP.pos[n._id], b = MAP.pos[t]; if (!a || !b || o.marks) continue;
    const on = !mini && lit && (n._id === lit || t === lit);
    const off = (litSet && !on) || (o.focus && byId[t].notebook._ref !== o.focus && n.notebook._ref !== o.focus) || (q && !(hit(n) && hit(byId[t])));
    const marker = plain ? "" : ` marker-end="url(#${p}${on ? "h" : "a"})"`;
    s += `<path class="m-edge${on ? " on" : ""}${off ? " dim" : ""}" d="${edgePath(a, b, mapR(n._id, mini) + 1, mapR(t, mini) + (mini ? 1 : 4))}"${marker}/>`;
  }
  for (const n of NOTES) {
    const at = MAP.pos[n._id]; if (!at) continue;
    const r = mapR(n._id, mini);
    const isSel = n._id === o.sel, mark = o.marks?.[n._id];
    const dim = (q && !hit(n)) || (litSet && !litSet.has(n._id)) || (o.marks && !mark);
    const near = litSet && litSet.has(n._id) && lit !== n._id;
    const label = full || (o.mode === "cluster" && n.notebook._ref === o.focus);
    s += `<g class="m-node${isSel ? " sel" : ""}${mark ? " cited" : ""}${dim ? " dim" : ""}${near ? " nb1" : ""}" data-mid="${n._id}" transform="translate(${at.x} ${at.y})">`;
    if (isSel && !mini) s += `<circle class="halo" r="${r + 9}"/>`;
    s += `<circle r="${r + 8}" fill="transparent"/><circle class="b" r="${r}" style="fill:${nbColor(n.notebook._ref)}"/>`;
    if (label) s += `<text class="lbl" text-anchor="middle" style="font-size:${fs}px;stroke-width:${3 / k}px">` + wrapLabel(n.title || "Untitled", 16).map((l, i) => `<tspan x="0" y="${r + fs * 1.25 + i * fs * 1.2}">${esc(l)}</tspan>`).join("") + `</text>`;
    if (mark) { const R = 7 / k; s += `<circle class="m-mark" cx="${r + R}" cy="${-r - R}" r="${R}"/><text class="m-mark-t" x="${r + R}" y="${-r - R + R * 0.4}" style="font-size:${R * 1.15}px">${mark}</text>`; }
    s += `</g>`;
  }
  return s;
}

const LG = { W: 340, H: 300, pos: {}, raf: 0 };

function localLayout(id, proposed) {
  const { W, H } = LG; const cx = W / 2, cy = 158;
  const nodes = [{ key: id, id, x: cx, y: cy, kind: "center", r: 10 }], edges = [];
  const ins = backs(id), right = [...outs(id), ...proposed.filter((p) => !outs(id).includes(p))];
  const left = ins.filter((x) => !right.includes(x));
  const shown = new Set([id, ...left, ...right]);
  const column = (list, x, side) => {
    const items = list.slice(0, list.length > 4 ? 3 : 4);
    const more = list.length - items.length;
    const n = items.length + (more ? 1 : 0); const gap = Math.min(70, (H - 90) / Math.max(n - 1, 1));
    items.forEach((nid, i) => {
      const y = cy + (i - (n - 1) / 2) * gap;
      const prop = side === "r" && !outs(id).includes(nid);
      nodes.push({ key: nid, id: nid, x, y, kind: prop ? "prop" : "n", r: 6 + Math.min(degree(nid), 4) * 0.8 });
      edges.push(side === "l" ? { a: nid, b: id, cls: "" } : { a: id, b: nid, cls: prop ? "prop" : "", both: ins.includes(nid) });
      const beyond = (side === "l" ? backs(nid) : outs(nid)).filter((d) => !shown.has(d)).slice(0, 3);
      beyond.forEach((d, j) => {
        shown.add(d);
        nodes.push({ key: d, id: d, x: side === "l" ? 14 : W - 14, y: y + (j - (beyond.length - 1) / 2) * 11, kind: "d2", r: 3.2 });
        edges.push(side === "l" ? { a: d, b: nid, cls: "d2" } : { a: nid, b: d, cls: "d2" });
      });
    });
    if (more) nodes.push({ key: "more-" + side, id: null, x, y: cy + (n - 1) / 2 * gap, kind: "more", r: 5, label: `+${more} more` });
  };
  column(left, 62, "l"); column(right, W - 62, "r");
  tagRelated(id, 4).filter((r) => !shown.has(r)).slice(0, 2).forEach((rid, i) => {
    nodes.push({ key: rid, id: rid, x: cx, y: i === 0 ? cy - 86 : cy + 82, kind: "tagged", r: 5 });
    edges.push({ a: id, b: rid, cls: "tagged" });
  });
  return { nodes, edges, cx, cy, empty: !left.length && !right.length };
}

function edgeD(e, A, B, a, b) {
  if (e.cls === "tagged") { const down = b.y > a.y ? 1 : -1; return `M${a.x} ${a.y + down * (A.r + 3)}L${b.x} ${b.y - down * (B.r + 3)}`; }
  const x1 = a.x + A.r + 2, x2 = b.x - B.r - 4, mx = (x1 + x2) / 2, f = (v) => v.toFixed(1);
  return `M${f(x1)} ${f(a.y)}C${f(mx)} ${f(a.y)} ${f(mx)} ${f(b.y)} ${f(x2)} ${f(b.y)}`;
}

function drawLocal(svg, L, P) {
  const { W, H } = LG;
  let s = arrowDefs("lg") + `<text class="g-cap" x="62" y="22" text-anchor="middle">LINKED FROM</text><text class="g-cap" x="${W - 62}" y="22" text-anchor="middle">LINKS TO</text>`;
  const byKey = Object.fromEntries(L.nodes.map((n) => [n.key, n]));
  for (const e of L.edges) {
    const A = byKey[e.a], B = byKey[e.b];
    const mk = e.cls === "tagged" ? "" : ` marker-end="url(#lg${e.cls === "prop" ? "p" : "a"})"${e.both ? ' marker-start="url(#lga)"' : ""}`;
    s += `<path class="g-edge ${e.cls}" data-a="${e.a}" data-b="${e.b}" d="${edgeD(e, A, B, P[e.a], P[e.b])}"${mk} style="opacity:${Math.min(P[e.a].o, P[e.b].o)}"/>`;
  }
  for (const n of L.nodes) {
    const p = P[n.key]; const note = n.id && byId[n.id];
    const color = note ? nbColor(note.notebook._ref) : "var(--c-faint)";
    s += `<g class="g-node ${n.kind}" ${n.id ? `data-open="${n.id}" data-gid="${n.id}"` : `data-act="morelinks"`} transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})" style="opacity:${p.o}">`;
    if (n.kind === "center") s += `<circle class="halo" r="${n.r + 7}"/>`;
    s += `<circle r="${n.r + 7}" fill="transparent"/><circle class="b" r="${n.r}" style="fill:${color};stroke:${n.kind === "tagged" ? color : ""}"/>`;
    if (n.kind !== "d2") {
      const lines = n.label ? [n.label] : wrapLabel(note.title || "Untitled", n.kind === "center" ? 18 : 16);
      s += `<text text-anchor="middle">` + lines.map((l, i) => `<tspan x="0" y="${n.r + 13 + i * 12.5}">${esc(l)}</tspan>`).join("") + `</text>`;
    }
    s += `</g>`;
  }
  if (L.empty) s += `<text class="g-hint" x="${W / 2}" y="${H - 14}" text-anchor="middle">No links yet</text>`;
  svg.innerHTML = s;
}

function renderLocalGraph(animate) {
  const svg = $("#lg"); if (!svg) return;
  const proposed = S.ai?.noteId === S.noteId ? S.ai.changes.filter((c) => c.link && c.status === "pending").map((c) => c.link) : [];
  const L = localLayout(S.noteId, proposed);
  const target = Object.fromEntries(L.nodes.map((n) => [n.key, { x: n.x, y: n.y, o: 1 }]));
  const from = LG.pos, origin = from[S.noteId] || { x: L.cx, y: L.cy };
  cancelAnimationFrame(LG.raf);
  const finish = () => { LG.pos = target; drawLocal(svg, L, target); if (S.tipId) showTip(S.tipId); };
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches || !Object.keys(from).length) return finish();
  const t0 = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - t0) / 320), e = 1 - Math.pow(1 - k, 3);
    const P = {};
    for (const [key, to] of Object.entries(target)) {
      const f = from[key] || { ...origin, o: 0 };
      P[key] = { x: f.x + (to.x - f.x) * e, y: f.y + (to.y - f.y) * e, o: f.o + (1 - f.o) * e };
    }
    drawLocal(svg, L, P);
    if (k < 1) LG.raf = requestAnimationFrame(step); else finish();
  };
  LG.raf = requestAnimationFrame(step);
}

function inlineFromDOM(el) {
  const out = [];
  const walk = (node) => {
    for (const c of node.childNodes) {
      if (c.nodeType === 3) out.push({ type: "text", value: c.textContent.replace(/ /g, " ") });
      else if (c.classList.contains("wl")) out.push({ type: "wikilink", target: c.dataset.id, docId: c.dataset.id, children: [{ type: "text", value: c.textContent }] });
      else if (!c.classList.contains("cb")) walk(c);
    }
  };
  walk(el);
  return out.filter((x) => x.type !== "text" || x.value);
}

function syncBody() {
  const n = byId[S.noteId];
  const old = Object.fromEntries(n.body.blocks.map((b) => [b.id, b]));
  n.body.blocks = [...$("#body").children].map((el, i) => {
    const id = el.dataset.block || `${n._id}-e${i}`;
    if (/^H\d$/.test(el.tagName)) return { id, type: "heading", level: +el.tagName[1], text: el.textContent };
    if (el.tagName === "UL") {
      const task = el.classList.contains("tasks");
      const items = [...el.children].map((li) => (task ? { content: inlineFromDOM(li.querySelector(".li-t") || li), checked: li.classList.contains("done") } : inlineFromDOM(li)));
      return { ...old[id], id, type: "list", items };
    }
    return { id, type: "paragraph", content: inlineFromDOM(el) };
  });
  const refs = new Set(n.body.blocks.flatMap((b) => (b.type === "list" ? b.items.flatMap(itemContent) : b.content || [])).filter((x) => x.type === "wikilink").map((x) => x.docId));

function wordDiff(a, b) {
  const A = a.split(/(\s+)/).filter(Boolean), B = b.split(/(\s+)/).filter(Boolean);
  const L = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  const push = (t, v) => { const last = out[out.length - 1]; if (last?.t === t) last.v += v; else out.push({ t, v }); };
  let i = 0, j = 0;
  while (i < A.length && j < B.length) {
    if (A[i] === B[j]) { push("=", A[i++]); j++; } else if (L[i + 1][j] >= L[i][j + 1]) push("-", A[i++]); else push("+", B[j++]);
  }
  while (i < A.length) push("-", A[i++]);
  while (j < B.length) push("+", B[j++]);
  return out;
}
function diffHTML(a, b) {
  const d = wordDiff(a, b);
  const kept = d.filter((s) => s.t === "=").map((s) => s.v).join("").trim().split(/\s+/).filter(Boolean).length;
  if (kept < b.split(/\s+/).length / 2) return `<del class="del-line">${esc(a)}</del><ins>${esc(b)}</ins>`;
  return d.map((s) => (s.t === "=" ? esc(s.v) : s.t === "-" ? `<del>${esc(s.v)}</del>` : `<ins>${esc(s.v)}</ins>`)).join("");
}

function proposeChanges(n) {
  if (n._id === "fx-note-00") return [
    { kind: "replace", block: "fx-note-00-p0", after: "Goal: a faster, calmer Harbor site with one clear call to action." },
    { kind: "replace", block: "fx-note-00-p1", after: "Owner: Ola Testesen. Deadline: end of Q4." },
    { kind: "insert", afterBlock: "fx-note-00-p1", text: "Pages and copy follow ", link: "fx-note-03", tail: "." },
  ];
  const first = sentences(n)[0] || n.title;
  const rel = tagRelated(n._id, 1)[0];
  const changes = [{ kind: "insert", afterBlock: null, text: "In short: " + first.replace(/\.$/, "").toLowerCase() + "." }];
  if (rel) changes.push({ kind: "insert", afterBlock: n.body.blocks[n.body.blocks.length - 1].id, text: "Related: ", link: rel, tail: "." });
  return changes;
}

function startAIEdit(noteId, prompt) {
  const n = byId[noteId];
  const changes = proposeChanges(n).map((c, i) => ({ ...c, i, status: "pending", before: c.block && inlineText(n.body.blocks.find((b) => b.id === c.block).content) }));
  S.ai = { noteId, prompt, changes, snapshot: JSON.stringify({ body: n.body, links: n.links }) };
}

function renderAIEdit(n, bar) {
  const ai = S.ai; const pending = ai.changes.filter((c) => c.status === "pending").length;
  const actions = pending
    ? `<button class="acc" data-act="accall">Accept all</button><button class="rej" data-act="rejall">Reject all</button>`
    : `<button class="btn sm" data-act="aiundo">Undo AI Edit <kbd>⌘Z</kbd></button><button class="btn sm primary" data-act="aidone">Done</button>`;
  const strip = `<div class="aibar"><span>✨</span><b>AI Edit</b><span>“${esc(ai.prompt)}”</span><span class="grow"></span><span class="muted">Claude Sonnet · your login · ≈ $0.004</span></div>
    <div class="aibar" style="background:var(--c-surface)"><b>${ai.changes.length} changes</b><span class="muted">${pending ? `${pending} to review` : "all reviewed"}</span><span class="grow"></span>${actions}</div>`;
  const box = (c, inner) => `<div class="chg ${c.status === "pending" ? "pending" : "done"}"><div class="chg-h"><span class="num">${c.i + 1}</span>${c.kind === "replace" ? "Rewrite" : c.link ? "Add a link" : "Add a line"}<span class="acts">${c.status === "pending"
    ? `<button class="acc" data-acc="${c.i}">✓ Accept</button><button class="rej" data-rej="${c.i}">✕ Reject</button>`
    : `<span class="state-tag ${c.status === "accepted" ? "a" : "r"}">${c.status === "accepted" ? "Accepted" : "Rejected"}</span>`}</span></div>${inner}</div>`;
  const insText = (c) => esc(c.text) + (c.link ? `<a class="wl prop" data-id="${c.link}">${esc(byId[c.link].title)}</a>` : "") + esc(c.tail || "");
  const inserts = (after) => ai.changes.filter((c) => c.kind === "insert" && c.afterBlock === after)
    .map((c) => box(c, `<p>${c.status === "pending" ? `<ins>${insText(c)}</ins>` : c.status === "rejected" ? `<del>${insText(c)}</del>` : insText(c)}</p>`)).join("");
  let body = inserts(null);
  for (const b of n.body.blocks) {
    if (ai.changes.some((c) => c.createdId === b.id)) continue;
    const c = ai.changes.find((c) => c.block === b.id);
    body += c ? box(c, `<p>${c.status === "pending" ? diffHTML(c.before, c.after) : esc(c.status === "accepted" ? c.after : c.before)}</p>`) : blockHTML(b);
    body += inserts(b.id);
  }
  $("#editor").innerHTML = bar + strip + `<div class="ed-scroll"><article class="doc"><h1 class="doc-title">${esc(n.title)}</h1>${metaHTML(n)}<div class="doc-body">${body}</div></article></div>`;
}

function resolveChange(i, accept) {
  const c = S.ai.changes[i]; const n = byId[S.ai.noteId];
  c.status = accept ? "accepted" : "rejected";
  if (accept && c.kind === "replace") n.body.blocks.find((b) => b.id === c.block).content = [{ type: "text", value: c.after }];
  if (accept && c.kind === "insert") {
    const content = [{ type: "text", value: c.text }];
    if (c.link) { content.push({ type: "wikilink", target: c.link, docId: c.link, children: [{ type: "text", value: byId[c.link].title }] }, { type: "text", value: c.tail }); n.links.push({ _ref: c.link, _key: c.link }); }
    c.createdId = `${n._id}-ai${i}`;
    const at = c.afterBlock ? n.body.blocks.findIndex((b) => b.id === c.afterBlock) + 1 : 0;
    n.body.blocks.splice(at, 0, { id: c.createdId, type: "paragraph", content });
  }
  if (accept) touch(n);
}

function undoAI() {

function versionHTML(blocks, other) {
  return blocks.map((b, i) => {
    const o = other[i];
    if (b.type === "paragraph") return `<p>` + wordDiff(inlineText(o.content), inlineText(b.content)).filter((s) => s.t !== "-").map((s) => (s.t === "+" ? `<span class="only">${esc(s.v)}</span>` : esc(s.v))).join("") + `</p>`;
    if (b.task) return `<ul>` + b.items.map((it, j) => `<li class="tk${it.checked ? " done" : ""}${it.checked !== o.items[j].checked ? " diff" : ""}"><span class="cb"></span><span class="tt">${esc(inlineText(it.content))}</span></li>`).join("") + `</ul>`;
    return blockHTML(b);
  }).join("");
}

function renderConflict(n) {
  const cf = S.conflict; const mac = n.body.blocks, phone = cf.phone.body.blocks;
  const col = (v, blocks, other, key) => `<div class="cf-col"><div class="cf-head"><b>${v.label}</b><span>${v.when}</span></div><div class="cf-body"><h1>${esc(n.title)}</h1>${versionHTML(blocks, other)}</div><div class="cf-foot"><button class="btn" data-keep="${key}">Keep ${v.keep} version</button></div></div>`;
  $("#editor").innerHTML = `<div class="bar ed-bar">${crumbHTML(n)}<div class="ed-actions"><span class="saved">2 versions</span></div></div>
    <div class="cf-note">This note changed on two devices while offline. Nothing is lost: both versions stay until you choose. Differences are highlighted.</div>
    <div class="ed-scroll"><div class="cf">${col(cf.mac, mac, phone, "mac")}${col(cf.phone, phone, mac, "phone")}<div class="cf-both"><button class="btn primary" data-keep="both">Keep both</button><span>Saves the iPhone version as a second note, linked to this one.</span></div></div></div>`;
}

function resolveConflict(which) {
  const cf = S.conflict, n = byId[cf.noteId], phone = cf.phone.body;
  if (which === "phone") n.body = phone;
  if (which === "both") {
    const id = "fx-note-30b";
    const blocks = phone.blocks.map((b) => ({ ...b, id: b.id.replace(n._id, id) }));
    blocks.push({ id: id + "-l", type: "paragraph", content: [{ type: "text", value: "Other version: " }, { type: "wikilink", target: n._id, docId: n._id, children: [{ type: "text", value: n.title }] }, { type: "text", value: "." }] });
    const copy = { _type: "note", _id: id, title: n.title + " (iPhone)", notebook: n.notebook, tags: n.tags, body: { blocks }, links: [{ _ref: n._id, _key: n._id }] };
    NOTES.push(copy); byId[id] = copy; touch(copy); computeMap();
  }
  touch(n); S.conflict = null;
  render(true);
  toast(which === "both" ? "Kept both. The iPhone version is a linked note." : `Kept ${cf[which].keep} version.`);
}

function renderCluster() {
  const n = byId[S.noteId]; const b = MAP.boxes[n.notebook._ref];
  const pad = 26, w = Math.max(b.w + pad * 2, 300), h = b.h + pad * 2;
  const ids = new Set(b.notes.map((m) => m._id));
  const inside = b.notes.reduce((s, m) => s + outs(m._id).filter((t) => ids.has(t)).length, 0);
  const across = {};
  for (const m of b.notes) for (const t of nbrs(m._id)) if (!ids.has(t)) { const o = byId[t].notebook._ref; across[o] = (across[o] || 0) + 1; }
  const rows = Object.entries(across).sort((x, y) => y[1] - x[1]);
  const max = Math.max(1, ...rows.map((r) => r[1]));
  const bars = rows.map(([id, c]) => `<div class="cl-nb">${nbDot(id)}${esc(nbById[id].name)}<i style="width:${(c / max) * 120}px;background:${nbColor(id)}"></i><span class="n">${c}</span></div>`).join("");

    <div class="rel"><h4>Connects to</h4>${bars || `<div class="rel-empty">No links to other notebooks yet.</div>`}</div>
    <div class="rail-foot"><button class="btn" data-act="openmap">${ICON.map}Open the full map <kbd>M</kbd></button></div>`;
}

const PRESET = {
  carousel: { read: 6, cites: [["fx-note-02", "Three wireframe rounds. Round two dropped the carousel."], ["fx-note-10", "Decision: drop the carousel."]],
    html: (c) => `<p>You dropped it. Round two of the Harbor wireframes removed the carousel ${c(1)}, and the week 41 sync logged it as a decision ${c(2)}.</p>` },
  dentist: { read: 3, notFound: true, cites: [["fx-note-25", "Before the end of the month."]],
    html: (c) => `<div class="nf"><b>Not in your notes.</b>No appointment date or time is written down. The closest note only says when to book ${c(1)}.</div>` },
};
const STOP = new Set("what when where which about with from that this have does did your there their they them would could should into over after before were been just also than then only some more most much many very tell know note notes give".split(" "));

function answer(q) {
  const ql = q.toLowerCase();
  if (ql.includes("carousel")) return PRESET.carousel;
  if (/dentist|appointment/.test(ql)) return PRESET.dentist;
  const terms = (ql.match(/[\p{L}\d]{4,}/gu) || []).filter((t) => !STOP.has(t)).map((t) => (t.length > 5 ? t.slice(0, -2) : t));
  const seen = new Set();
  const top = NOTES.flatMap((n) => sentences(n).map((s) => ({ id: n._id, s, score: terms.filter((t) => s.toLowerCase().includes(t)).length })))
    .filter((h) => h.score > 0).sort((a, b) => b.score - a.score)
    .filter((h) => !seen.has(h.id) && seen.add(h.id)).slice(0, 3);
  if (!top.length) return { read: NOTES.length, notFound: true, cites: [], html: () => `<div class="nf"><b>Not in your notes.</b>Nothing you have written mentions this. Ask won’t guess.</div>` };
  return { read: NOTES.length, cites: top.map((h) => [h.id, h.s]), html: (c) => `<p>Here is what your notes say:</p>` + top.map((h, i) => `<p>“${esc(h.s)}” ${c(i + 1)}</p>`).join("") };
}

function answerHTML({ q, a }) {
  const cite = (i, tag = "button") => { const [id, quote] = a.cites[i - 1]; return `<${tag} class="cite" data-open="${id}" data-quote="${esc(quote)}" title="${esc(byId[id].title)}">${i}</${tag}>`; };
  const srcs = a.cites.map(([id, quote], i) => `<button class="src" data-open="${id}" data-quote="${esc(quote)}"><span class="t">${cite(i + 1, "span")}${nbDot(byId[id].notebook._ref)}${esc(byId[id].title)}</span><span class="qt">“${esc(quote)}”</span></button>`).join("");
  const marks = Object.fromEntries(a.cites.map(([id], i) => [id, i + 1]));
  const where = !a.notFound ?`<div class="ask-map"><span class="cap">Where this came from</span><svg viewBox="-10 -10 ${MAP.W + 20} ${MAP.H + 20}">${mapSVG({ mode: "ask", marks, scale: 290 / (MAP.W + 20), prefix: "ak" })}</svg></div>` : "";
  return `<div class="q">${esc(q)}</div><div class="a">${a.html(cite)}${srcs ? `<div class="srcs">${srcs}</div>` : ""}${where}<div class="meta">${a.notFound ? "Checked" : "Read"} ${a.read} notes · Claude Sonnet · your login · ≈ $0.002</div></div>`;
}

function renderAsk() {

  if (!S.aiOn) { $("#rail").innerHTML = `<div class="ask">${head}<div class="ai-off">AI is off. Nothing leaves this Mac.</div></div>`; return; }

function renderBoard() {
  const lists = NOTES.flatMap((n) => n.body.blocks.filter((b) => b.task).map((b) => ({ n, b })));
  const all = lists.flatMap((l) => l.b.items), open = all.filter((i) => !i.checked).length;
  let h = `<div class="bar board-h"><b>Tasks</b><span class="muted">${open} open · ${all.length - open} done · from ${lists.length} checklists. Ticking here ticks the note.</span></div><div class="cols">`;
  for (const nb of NB) {
    const mine = lists.filter((l) => l.n.notebook._ref === nb._id).sort((x, y) => y.n._updated - x.n._updated);
    if (!mine.length) continue;
    const items = mine.flatMap((l) => l.b.items), done = items.filter((i) => i.checked).length;
    h += `<div class="col"><div class="col-h">${nbDot(nb._id)}${esc(nb.name)}<span class="n">${items.length - done} open</span></div><div class="prog"><i style="width:${(done / items.length) * 100}%;background:${nbColor(nb._id)}"></i></div>`;
    for (const { n, b } of mine) {
      h += `<div class="card"><button class="card-t" data-open="${n._id}">${esc(n.title)}</button>` + b.items.map((it, i) => `<div class="tk${it.checked ? " done" : ""}"><span class="cb" role="checkbox" aria-checked="${!!it.checked}" data-tick="${n._id}|${b.id}|${i}"></span><span class="tt">${esc(inlineText(it.content))}</span><button class="go" data-open="${n._id}" data-line="${b.id}|${i}" title="Open at this line">↗ line</button></div>`).join("") + `</div>`;
    }
    h += `</div>`;
  }
  $("#board").innerHTML = h + `</div>`;
}

function fitVB(box) {
  const svg = $("#msvg"); const W = svg.clientWidth, H = svg.clientHeight;
  const room = S.mapSel && W > 900 ? W - 330 : W;
  const b = box || { x: -30, y: -30, w: MAP.W + 60, h: MAP.H + 60 };
  const k = Math.min(room / b.w, H / b.h, box ? 2.2 : 1.35);
  S.vb = { x: b.x + b.w / 2 - room / k / 2, y: b.y + b.h / 2 - H / k / 2, w: W / k, h: H / k };
}

function openMap() { S.map = true; S.mapSel = S.noteId; S.vb = null; renderMap(); }
function closeMap() { S.map = false; renderMap(); }

function wireMap() {
  const svg = $("#msvg"); let drag = null, moved = false, lastClick = 0;
  const setVB = () => svg.setAttribute("viewBox", `${S.vb.x} ${S.vb.y} ${S.vb.w} ${S.vb.h}`);
  svg.addEventListener("wheel", (e) => {
    e.preventDefault(); const r = svg.getBoundingClientRect();
    const k = Math.min(Math.max(S.vb.w * Math.exp(e.deltaY * 0.0016), 300), MAP.W * 3) / S.vb.w;
    const wx = S.vb.x + (e.clientX - r.left) / r.width * S.vb.w, wy = S.vb.y + (e.clientY - r.top) / r.height * S.vb.h;
    S.vb = { x: wx - (wx - S.vb.x) * k, y: wy - (wy - S.vb.y) * k, w: S.vb.w * k, h: S.vb.h * k };
    renderMap();
  }, { passive: false });
  svg.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, vb: S.vb }; moved = false; });
  addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; svg.classList.add("drag"); }
    if (!moved) return;
    const r = svg.getBoundingClientRect();
    S.vb = { ...drag.vb, x: drag.vb.x - dx * drag.vb.w / r.width, y: drag.vb.y - dy * drag.vb.h / r.height }; setVB();
  });
  addEventListener("pointerup", () => { drag = null; svg.classList.remove("drag"); });
  svg.addEventListener("pointerup", (e) => {
    if (moved) return;
    const id = e.target.closest("[data-mid]")?.dataset.mid || null;
    const again = id && id === S.mapSel && e.timeStamp - lastClick < 450;
    lastClick = e.timeStamp;
    if (again) { closeMap(); return openNote(id); }
    S.mapSel = id; renderMap();
  });
  svg.addEventListener("mouseover", (e) => { const id = e.target.closest("[data-mid]")?.dataset.mid || null; if (id !== S.mapHov) { S.mapHov = id; renderMap(); } });
  svg.addEventListener("mouseleave", () => { S.mapHov = null; renderMap(); });
  $("#mq").addEventListener("input", (e) => { S.mapQ = e.target.value; renderMap(); });
}

function renderMobile() {

function render(forceEditor) {

function refreshAll() { renderEditor(true); renderRail(true); renderList(); renderSidebar(); }

function openNote(id, opts = {}) {
  S.noteId = id; S.view = "notes"; S.tipId = null;
  if (!S.query && !S.visible.includes(id)) S.nb = byId[id].notebook._ref;
  if (isMobile()) S.mv = "note";
  render(true);
  $(`.row[data-open="${id}"]`)?.scrollIntoView({ block: "nearest" });
  if (opts.quote || opts.line) requestAnimationFrame(() => flashIn(opts));
}

function flashIn({ quote, line }) {
  let el;
  if (line) { const [bid, i] = line.split("|"); el = $(`#body [data-block="${bid}"] li[data-i="${i}"]`); }
  else el = $$("#body > *").find((b) => b.textContent.includes(quote.slice(0, 24)));
  if (!el) return;
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  el.scrollIntoView({ block: "center" });
}

function setNb(nb) {
  S.nb = nb; S.query = ""; $("#q").value = ""; S.view = "notes";
  if (isMobile()) S.mv = "list"; else S.noteId = listNotes()[0]?._id || S.noteId;
  render();
}

function move(d) {
  const v = S.visible, i = v.indexOf(S.noteId);
  const j = i < 0 ? 0 : Math.min(Math.max(i + d, 0), v.length - 1);
  if (v[j] && v[j] !== S.noteId) openNote(v[j]);
}

function tick(nid, bid, i) {
  const it = byId[nid].body.blocks.find((b) => b.id === bid).items[+i];
  it.checked = !it.checked;
  changed(byId[nid]);
  return it.checked;
}

let toastT = 0;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem("c-map-theme", t); } catch (e) {} }
const toggleTheme = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

const ACTIONS = {
  tasks: () => { S.view = "tasks"; if (isMobile()) S.mv = "tasks"; render(); },
  openmap: openMap,
  closemap: closeMap,
  mapopen: () => { const id = S.mapSel; closeMap(); openNote(id); },
  zfit: () => { S.vb = null; renderMap(); },
  theme: toggleTheme,
  aiedit: () => { startAIEdit(S.noteId, "Tighten the summary and link related notes"); refreshAll(); },
  accall: () => { S.ai.changes.filter((c) => c.status === "pending").forEach((c) => resolveChange(c.i, true)); refreshAll(); },
  rejall: () => { S.ai.changes.filter((c) => c.status === "pending").forEach((c) => resolveChange(c.i, false)); refreshAll(); },
  aiundo: undoAI,
  aidone: () => { S.ai = null; refreshAll(); toast("AI Edit applied."); },
  mback: () => { S.mv = "list"; render(); },
  morelinks: () => $(".rel")?.scrollIntoView({ block: "start", behavior: "smooth" }),
};

document.addEventListener("click", (e) => {
  const t = e.target, at = (sel) => t.closest(sel);
  let el;
  if ((el = at("[data-tick]"))) { const done = tick(...el.dataset.tick.split("|")); el.closest(".tk").classList.toggle("done", done); el.setAttribute("aria-checked", done); renderSidebar(); return; }
  if ((el = at("#body .cb"))) { const li = el.closest("li"); li.classList.toggle("done", tick(S.noteId, li.parentElement.dataset.block, li.dataset.i)); return; }
  if ((el = at("[data-state]"))) return applyState(+el.dataset.state);
  if ((el = at("[data-acc]"))) { resolveChange(+el.dataset.acc, true); return refreshAll(); }
  if ((el = at("[data-rej]"))) { resolveChange(+el.dataset.rej, false); return refreshAll(); }
  if ((el = at("[data-keep]"))) return resolveConflict(el.dataset.keep);
  if ((el = at("[data-askq]"))) { S.ask.push({ q: el.dataset.askq, a: answer(el.dataset.askq) }); return renderAsk(); }
  if ((el = at("[data-zoomnb]"))) { const b = MAP.boxes[el.dataset.zoomnb]; fitVB({ x: b.x - 40, y: b.y - 40, w: b.w + 80, h: b.h + 80 }); return renderMap(); }
  if ((el = at("[data-mapsel]"))) { S.mapSel = el.dataset.mapsel; return renderMap(); }
  if ((el = at("[data-mtab]"))) {
    S.mv = el.dataset.mtab; S.view = S.mv === "tasks" ? "tasks" : "notes";
    S.rail = S.mv === "ask" ? "ask" : S.rail === "ask" ? "links" : S.rail;
    return render();
  }
  if ((el = at("[data-rail]"))) { S.rail = el.dataset.rail; S.tipId = null; return renderRail(false); }
  if ((el = at("[data-nb]"))) return setNb(el.dataset.nb);
  if ((el = at("[data-open]")) && !at("#body")) { if (S.map) closeMap(); return openNote(el.dataset.open, { quote: el.dataset.quote, line: el.dataset.line }); }
  if ((el = at("[data-act]")) && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act]();
});

document.addEventListener("change", (e) => { if (e.target.dataset.act === "aitoggle") { S.aiOn = e.target.checked; renderAsk(); } });

document.addEventListener("mousedown", (e) => { const w = e.target.closest(".doc .wl"); if (w) { e.preventDefault(); openNote(w.dataset.id); } });

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("#askq").value.trim(); if (!q) return;
  S.ask.push({ q, a: answer(q) }); renderAsk();
  $("#askq").focus(); $("#rail").scrollTop = 1e6;
});

document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "q") {
    S.query = e.target.value; renderList();
    if (S.visible.length && !S.visible.includes(S.noteId)) { S.noteId = S.visible[0]; renderEditor(); renderRail(true); renderList(); }
  }
  if (id === "title") { byId[S.noteId].title = e.target.textContent; changed(byId[S.noteId]); }
  if (id === "body") syncBody();
});

document.addEventListener("mouseover", (e) => { const w = e.target.closest(".wl[data-id], .rel-row"); if (w) hoverGraph(w.dataset.id || w.dataset.open); });
document.addEventListener("mouseout", (e) => { const w = e.target.closest(".wl[data-id], .rel-row"); if (w && !w.contains(e.relatedTarget)) hoverGraph(null); });

document.addEventListener("keydown", (e) => {
  const t = e.target, typing = t.isContentEditable || /INPUT|TEXTAREA/.test(t.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key === "z" && S.ai && !typing) { e.preventDefault(); return undoAI(); }
  if (e.key === "Escape") return S.map ? closeMap() : typing && t.blur();
  if (t.id === "title" && e.key === "Enter") { e.preventDefault(); return $("#body").focus(); }
  if (typing && !(t.id === "q" && /^(ArrowUp|ArrowDown)$/.test(e.key))) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) return applyState(+e.key);
  if (S.map) { if (e.key === "Enter" && S.mapSel) ACTIONS.mapopen(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); return move(e.key === "ArrowDown" ? 1 : -1); }
  if (e.key === "Enter") { e.preventDefault(); return $("#body")?.focus(); }
  if (e.key === "/") { e.preventDefault(); return $("#q").focus(); }
  if (e.key === "m") return openMap();
  if (e.key === "t") return toggleTheme();
});

addEventListener("resize", () => { renderMobile(); if (S.map) { S.vb = null; renderMap(); } });

const STATES = ["Browse a notebook", "Note open with its link graph", "✨ Ask with citations", "AI Edit diff", "Tasks board", "Offline", "Conflict", "Mobile ≈390 px", "Full map"];
const BASE = JSON.stringify(NOTES);
const DEFAULTS = JSON.stringify(S);

const SETUP = {
  1: { nb: "fx-nb-projects", noteId: "fx-note-02", rail: "cluster" },
  2: { nb: "fx-nb-projects", noteId: "fx-note-01", tipId: "fx-note-40" },
  3: { nb: "fx-nb-meetings", noteId: "fx-note-10", rail: "ask", ask: [{ q: "What did we decide about the carousel?", a: PRESET.carousel }, { q: "When is my dentist appointment?", a: PRESET.dentist }] },
  4: { nb: "fx-nb-projects", noteId: "fx-note-00" },
  5: { view: "tasks" },
  6: { nb: "fx-nb-inbox", noteId: "fx-note-24", offline: true, pending: 3 },
  7: { nb: "fx-nb-home", noteId: "fx-note-30" },
  8: { nb: "fx-nb-projects", noteId: "fx-note-01", mv: "note" },
  9: { nb: "fx-nb-projects", noteId: "fx-note-00" },
};

function applyState(k) {
  NOTES.length = 0;
  for (const n of JSON.parse(BASE)) { n._updated = new Date(n._updated); NOTES.push(n); }
  for (const key of Object.keys(byId)) delete byId[key];
  for (const n of NOTES) byId[n._id] = n;
  computeMap();
  Object.assign(S, JSON.parse(DEFAULTS), SETUP[k], { stateN: k });
  S.forced = k === 8 && !matchMedia("(max-width: 700px)").matches;
  document.body.classList.toggle("frame", S.forced);
  if (k === 4) startAIEdit("fx-note-00", "Tighten the summary and link the content plan");
  if (k === 7) S.conflict = makeConflict();
  $("#q").value = ""; $("#mq").value = ""; LG.pos = {};
  $("#pending").textContent = S.pending ? `${S.pending} edits waiting` : "";
  S.visible = listNotes().map((n) => n._id);
  render(true);
  if (k === 9) openMap();
  $("#app").scrollTop = 0;
}

function renderSwitcher() {
  $("#switcher").innerHTML = STATES.map((t, i) => `<button data-state="${i + 1}" class="${S.stateN === i + 1 ? "on" : ""}" title="${i + 1} · ${esc(t)}">${i + 1}</button>`).join("");
}

(function boot() {
  const params = new URLSearchParams(location.search);
  let theme = params.get("theme");
  try { theme ||= localStorage.getItem("c-map-theme"); } catch (e) {}
  document.documentElement.dataset.theme = theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  wireMap();
  applyState(+params.get("s") || 2);
})();

</script>
</body>
</html>
