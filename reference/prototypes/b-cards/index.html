<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barkever Visual Cards</title>
<style>
:root {
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --text-2xs: 10px; --text-xs: 11px; --text-s: 12px; --text-m: 13px; --text-base: 14px;
  --text-l: 16px; --text-xl: 19px; --text-2xl: 26px;
  --leading-tight: 1.25; --leading: 1.5; --leading-body: 1.62;
  --weight-medium: 500; --weight-strong: 600;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px; --space-10: 40px;
    --radius-xs: 3px; --radius-s: 5px; --radius-m: 8px; --radius-l: 11px; --radius-pill: 999px;
    --w-sidebar: 224px; --w-list: 380px; --w-ask: 360px; --w-rail: 150px; --w-read: 560px;
  --h-bar: 48px; --h-card: 84px; --h-banner: 30px;
    --bg-sidebar: #efeee9; --bg-list: #f6f5f2; --bg-editor: #ffffff; --bg-card: #ffffff;
  --bg-hover: rgba(30, 32, 36, .045); --bg-active: rgba(30, 32, 36, .075);
  --bg-chip: #efeee9; --bg-input: #ffffff; --bg-banner: #ebeae5; --bg-inset: #f6f5f2;
    --line: #e4e2dc; --line-strong: #d2cfc7; --focus: #335fb0;
    --text: #1d1f22; --text-2: #575b62; --text-3: #8a8e95;
    --accent: #335fb0; --accent-soft: #e9eef8; --accent-line: #c6d3ee; --on-accent: #ffffff;
    --ok: #3d7a57; --ok-soft: #e4f0e8; --warn: #9a6514; --warn-soft: #f6eedd;
  --del-bg: #fbe7e5; --del-fg: #a12f29; --ins-bg: #e1f2e6; --ins-fg: #1d6a3c;
    --shape-paper: #ffffff; --shape-edge: #cfccc4; --shape-ink: #6e737a; --shape-faint: #c3c6cb;
  --track: #e8e6e0;
  --dg-paper: #ffffff; --dg-ink: #7d828a; --dg-faint: #e6e5e0; --dg-text: #3f434a;
  --shadow-pop: 0 6px 24px rgba(20, 22, 26, .10), 0 1px 3px rgba(20, 22, 26, .08);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg-sidebar: #151618; --bg-list: #1a1b1e; --bg-editor: #1f2023; --bg-card: #232427;
  --bg-hover: rgba(255, 255, 255, .045); --bg-active: rgba(255, 255, 255, .08);
  --bg-chip: #2c2e32; --bg-input: #26272b; --bg-banner: #2a2b2f; --bg-inset: #1a1b1e;
  --line: #2f3135; --line-strong: #3d4045; --focus: #8eabef;
  --text: #e8e8e6; --text-2: #a8abb1; --text-3: #767a81;
  --accent: #8eabef; --accent-soft: #263049; --accent-line: #3b4a70; --on-accent: #10131a;
  --ok: #7cc196; --ok-soft: #1f3328; --warn: #e0b25e; --warn-soft: #3a3020;
  --del-bg: #3d2423; --del-fg: #f1a39d; --ins-bg: #1e3628; --ins-fg: #93d8aa;
  --shape-paper: #2a2b2f; --shape-edge: #4a4d53; --shape-ink: #a3a7ad; --shape-faint: #55585e;
  --track: #34363b;
  --dg-paper: #2a2b2f; --dg-ink: #9196a0; --dg-faint: #3a3c41; --dg-text: #d4d5d8;
  --shadow-pop: 0 8px 28px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: var(--text-base)/var(--leading) var(--font-ui); color: var(--text); background: var(--bg-list);
  -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: var(--radius-s); }
svg { display: block; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico-s { width: 13px; height: 13px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; padding: 0 1px; }

.app { display: grid; height: 100vh; grid-template-columns: var(--w-sidebar) var(--w-list) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "side banner banner" "side list main"; }
.app.has-ask { grid-template-columns: var(--w-sidebar) var(--w-list) minmax(0, 1fr) var(--w-ask);
  grid-template-areas: "side banner banner banner" "side list main ask"; }
.app.is-board { grid-template-columns: var(--w-sidebar) minmax(0, 1fr); grid-template-areas: "side banner" "side main"; }
.app.is-board .list { display: none; }

.side { grid-area: side; background: var(--bg-sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: var(--space-2); height: var(--h-bar); padding: 0 var(--space-4); font-weight: var(--weight-strong); font-size: var(--text-base); letter-spacing: -.01em; }
.brand-mark { width: 18px; height: 18px; }
.new-btn { margin: 0 var(--space-3) var(--space-3); height: 32px; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3);
  background: var(--bg-card); border: 1px solid var(--line-strong); border-radius: var(--radius-m); font-weight: var(--weight-medium); font-size: var(--text-m); }
.new-btn:hover { border-color: var(--text-3); }
.new-btn kbd { margin-left: auto; }
kbd { font: var(--text-xs)/1 var(--font-ui); color: var(--text-3); border: 1px solid var(--line-strong); border-radius: var(--radius-xs); padding: 2px 4px; background: transparent; }
.side-scroll { overflow: auto; flex: 1; padding-bottom: var(--space-3); }
.side-h { font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--text-3); padding: var(--space-4) var(--space-4) var(--space-1); }
.nav { display: flex; align-items: center; gap: var(--space-2); width: calc(100% - var(--space-4)); margin: 0 var(--space-2); height: 28px; padding: 0 var(--space-2);
  border-radius: var(--radius-s); font-size: var(--text-m); color: var(--text-2); text-align: left; }
.nav:hover { background: var(--bg-hover); color: var(--text); }
.nav[aria-current="true"] { background: var(--bg-active); color: var(--text); font-weight: var(--weight-medium); }
.nav .count { margin-left: auto; font-size: var(--text-xs); color: var(--text-3); }
.nav.child { padding-left: calc(var(--space-2) + 18px); }
.nav .hash { color: var(--text-3); width: 16px; text-align: center; }
.side-foot { border-top: 1px solid var(--line); padding: var(--space-2) var(--space-3); display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-s); color: var(--text-3); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.sync-dot.off { background: transparent; border: 1.5px solid var(--text-3); }
.foot-btn { margin-left: auto; height: 26px; width: 26px; display: grid; place-items: center; border-radius: var(--radius-s); color: var(--text-2); }
.foot-btn + .foot-btn { margin-left: 0; }
.foot-btn:hover { background: var(--bg-hover); }

.banner { grid-area: banner; display: none; height: var(--h-banner); align-items: center; gap: var(--space-2); padding: 0 var(--space-4);
  background: var(--bg-banner); border-bottom: 1px solid var(--line); font-size: var(--text-s); color: var(--text-2); }
.app.is-offline .banner { display: flex; }
.banner .right { margin-left: auto; color: var(--text-3); }

.list { grid-area: list; display: flex; flex-direction: column; min-height: 0; background: var(--bg-list); border-right: 1px solid var(--line); }
.list-head { padding: 0 var(--space-4); }
.list-title { display: flex; align-items: baseline; gap: var(--space-2); height: var(--h-bar); padding-top: 14px; }
.list-title h1 { margin: 0; font-size: var(--text-l); font-weight: var(--weight-strong); letter-spacing: -.01em; }
.list-title .sub { font-size: var(--text-s); color: var(--text-3); }
.list-title .sort { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; font-size: var(--text-s); color: var(--text-3); }
.search { display: flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-2) 0 var(--space-3); margin: var(--space-1) 0 var(--space-3);
  background: var(--bg-input); border: 1px solid var(--line); border-radius: var(--radius-m); color: var(--text-3); }
.search:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: var(--text-m); color: var(--text); min-width: 0; }
.search input::placeholder { color: var(--text-3); }
.cards { flex: 1; overflow: auto; padding: 0 var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 6px; outline: 0; }
.group-label { font-size: var(--text-xs); color: var(--text-3); padding: var(--space-2) var(--space-1) 2px; font-weight: var(--weight-medium); }
.empty { padding: var(--space-6) var(--space-3); font-size: var(--text-m); color: var(--text-3); text-align: center; }

.card { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: var(--space-3); align-items: start; flex: none;
  height: var(--h-card); padding: var(--space-3) var(--space-3) var(--space-3) var(--space-3); text-align: left; width: 100%;
  background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-l); cursor: default; position: relative; }
.card:hover { border-color: var(--line-strong); }
.card[aria-selected="true"] { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line); }
.cards:focus-within .card[aria-selected="true"], .cards:focus .card[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card-shape { padding-top: 1px; }
.card-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card-top { display: flex; align-items: baseline; gap: var(--space-2); }
.card-title { font-size: var(--text-base); font-weight: var(--weight-strong); line-height: var(--leading-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.005em; }
.card-title.untitled { color: var(--text-3); font-weight: var(--weight-medium); }
.card-time { margin-left: auto; font-size: var(--text-xs); color: var(--text-3); white-space: nowrap; flex: none; display: flex; align-items: center; gap: 5px; }
.pending { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--text-3); display: none; }
.app.is-offline .pending.on { display: inline-block; }
.card-sub { font-size: var(--text-s); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.outline { display: flex; align-items: center; gap: 5px; color: var(--text-2); }
.outline .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); flex: none; }
.outline .ol-ico { color: var(--text-3); }
.card-facts { display: flex; align-items: center; gap: var(--space-2); margin-top: 3px; height: 18px; font-size: var(--text-xs); color: var(--text-3); }
.slot-tasks { width: 66px; flex: none; display: flex; align-items: center; gap: 5px; }
.slot-links { width: 34px; flex: none; display: flex; align-items: center; gap: 3px; }
.bar { width: 30px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; flex: none; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.bar.done > i { background: var(--ok); }
.chips { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
.chip { font-size: var(--text-xs); line-height: 16px; padding: 0 6px; border-radius: var(--radius-xs); background: var(--bg-chip); color: var(--text-2); white-space: nowrap; }
.nb-label { color: var(--text-3); }
.card-thumb { width: 54px; height: 42px; border-radius: var(--radius-s); border: 1px solid var(--line); overflow: hidden; background: var(--dg-paper); margin-top: 1px; }
.card-thumb svg { width: 100%; height: 100%; }
.card-thumb .dg-text, .card-thumb .dg-small { display: none; }

.shape .s-paper { fill: var(--shape-paper); stroke: var(--shape-edge); }
.shape .s-ink { fill: var(--shape-ink); }
.shape .s-faint { fill: var(--shape-faint); }
.shape .s-acc { fill: var(--accent); }
.shape .s-ok { fill: var(--ok); }
.shape .s-box { fill: none; stroke: var(--shape-ink); stroke-width: .8; }
.shape .s-img { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: .6; }

.dg-box { fill: var(--dg-paper); stroke: var(--dg-ink); stroke-width: 1.2; }
.dg-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.dg-faint { fill: var(--dg-faint); }
.dg-paper { fill: var(--dg-paper); stroke: var(--dg-ink); stroke-width: 1.2; }
.dg-ink { fill: var(--dg-ink); }
.dg-line { fill: none; stroke: var(--dg-ink); stroke-width: 1.2; }
.dg-text { font: 600 10px var(--font-ui); fill: var(--dg-text); }
.dg-small { font: 10px var(--font-ui); fill: var(--dg-ink); }
.dg-type { font: 600 34px var(--font-ui); fill: var(--dg-text); }

.main { grid-area: main; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg-editor); }
.bar-top { height: var(--h-bar); flex: none; display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-4) 0 var(--space-6); border-bottom: 1px solid var(--line); font-size: var(--text-s); color: var(--text-3); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.crumbs b { color: var(--text-2); font-weight: var(--weight-medium); }
.saved { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.tool { height: 30px; padding: 0 var(--space-2); display: flex; align-items: center; gap: 6px; border-radius: var(--radius-s); color: var(--text-2); font-size: var(--text-s); font-weight: var(--weight-medium); }
.tool:hover { background: var(--bg-hover); color: var(--text); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.spark { color: var(--accent); }
.ai-menu { position: absolute; right: var(--space-4); top: 42px; z-index: 5; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-m); box-shadow: var(--shadow-pop); padding: 4px; width: 220px; }
.ai-menu button { display: flex; width: 100%; align-items: center; gap: var(--space-2); padding: 7px var(--space-2); border-radius: var(--radius-s); font-size: var(--text-m); color: var(--text); text-align: left; }
.ai-menu button:hover { background: var(--bg-hover); }
.ai-menu kbd { margin-left: auto; }
.ai-menu .note { font-size: var(--text-xs); color: var(--text-3); padding: 6px var(--space-2) 4px; border-top: 1px solid var(--line); margin-top: 4px; }

.doc-wrap { flex: 1; overflow: auto; position: relative; }
.doc-grid { display: grid; grid-template-columns: minmax(0, var(--w-read)) var(--w-rail); gap: var(--space-8); justify-content: center; padding: var(--space-8) var(--space-6) 80px; }
.app.has-ask .doc-grid, .doc-grid.narrow { grid-template-columns: minmax(0, var(--w-read)); }
.app.has-ask .rail, .doc-grid.narrow .rail { display: none; }
.doc { min-width: 0; }
.doc-title { font-size: var(--text-2xl); font-weight: var(--weight-strong); letter-spacing: -.02em; line-height: var(--leading-tight); margin: 0 0 var(--space-2); outline: 0; }
.doc-title:empty::before { content: "Untitled"; color: var(--text-3); }
.doc-meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); font-size: var(--text-s); color: var(--text-3); margin-bottom: var(--space-6); }
.doc-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
.body { font-size: var(--text-l); line-height: var(--leading-body); }
.body [contenteditable] { outline: 0; }
.body h2 { font-size: var(--text-xl); font-weight: var(--weight-strong); letter-spacing: -.01em; margin: var(--space-6) 0 var(--space-2); line-height: var(--leading-tight); }
.body h2:first-child { margin-top: 0; }
.body p { margin: 0 0 var(--space-3); }
.body ul { margin: 0 0 var(--space-4); padding-left: 22px; }
.body ul.tasks { list-style: none; padding-left: 0; }
.body li { margin: 2px 0; }
.body ul.tasks li { display: flex; align-items: flex-start; gap: 10px; padding: 3px 6px; margin: 0 -6px; border-radius: var(--radius-s); }
.body ul.tasks li.done .t { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
.cb { width: 18px; height: 18px; flex: none; margin-top: 4px; border: 1.5px solid var(--line-strong); border-radius: var(--radius-xs); display: grid; place-items: center; background: var(--bg-card); }
.cb:hover { border-color: var(--accent); }
.cb.on { background: var(--ok); border-color: var(--ok); color: var(--bg-editor); }
.cb svg { width: 12px; height: 12px; stroke-width: 2.2; }
.wikilink { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); cursor: pointer; }
.wikilink:hover { border-bottom-color: var(--accent); }
figure { margin: var(--space-2) 0 var(--space-5); }
figure .frame { border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden; background: var(--dg-paper); }
figure svg { width: 100%; height: auto; max-height: 300px; }
figcaption { font-size: var(--text-s); color: var(--text-3); margin-top: var(--space-2); }
.backlinks { margin-top: var(--space-10); padding-top: var(--space-4); border-top: 1px solid var(--line); }
.backlinks h3 { font-size: var(--text-s); font-weight: var(--weight-medium); color: var(--text-3); margin: 0 0 var(--space-3); }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-2); }
.mini { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--bg-card); text-align: left; min-width: 0; }
.mini:hover { border-color: var(--line-strong); }
.mini .t { font-size: var(--text-m); font-weight: var(--weight-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .s { font-size: var(--text-xs); color: var(--text-3); }
.mini > span:last-child { min-width: 0; display: flex; flex-direction: column; }

.rail { position: sticky; top: var(--space-8); align-self: start; font-size: var(--text-s); color: var(--text-3); }
.rail-shape { padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--bg-inset); display: grid; place-items: center; margin-bottom: var(--space-4); }
.rail h4 { font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--text-3); margin: 0 0 var(--space-2); }
.rail-facts { list-style: none; margin: 0 0 var(--space-5); padding: 0; display: grid; gap: 6px; }
.rail-facts li { display: flex; align-items: center; gap: var(--space-2); color: var(--text-2); }
.rail-facts .k { color: var(--text-3); }
.rail-ol button { display: block; width: 100%; text-align: left; padding: 3px 0 3px 10px; border-left: 2px solid var(--line); color: var(--text-2); font-size: var(--text-s); }
.rail-ol button:hover { border-left-color: var(--accent); color: var(--text); }
.empty-main { margin: auto; text-align: center; color: var(--text-3); font-size: var(--text-m); }

.edit-bar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-3); margin-bottom: var(--space-5); border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: var(--radius-m); font-size: var(--text-s); color: var(--text-2); }
.edit-bar .edit-prompt { color: var(--text); font-weight: var(--weight-medium); }
.edit-bar .grow { flex: 1; }
.btn { height: 28px; padding: 0 var(--space-3); border-radius: var(--radius-s); border: 1px solid var(--line-strong); background: var(--bg-card); font-size: var(--text-s); font-weight: var(--weight-medium); color: var(--text); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ok { color: var(--ins-fg); }
.btn.no { color: var(--del-fg); }
.btn.small { height: 24px; padding: 0 var(--space-2); font-size: var(--text-xs); }
.hunk { position: relative; margin: 0 -10px var(--space-3); padding: 6px 10px; border-radius: var(--radius-s); border-left: 3px solid var(--accent-line); background: var(--bg-inset); }
.hunk.decided { border-left-color: transparent; background: transparent; }
.hunk p { margin: 0; }
.hunk-actions { display: flex; gap: 6px; margin-top: 6px; align-items: center; font-size: var(--text-xs); color: var(--text-3); }

  return { q, a: `<p>From your notes: ${top.map((t, i) => `${esc(t.sent.replace(/\.$/, ""))} <span class="cite" data-go="${t.n.id}">${i + 1}</span>`).join("; ")}.</p>`, srcs: top.map((t) => [t.n.id, t.sent]), meta: `${top.length} ${top.length === 1 ? "note" : "notes"} cited · 50 searched` };
}

      <button class="switch ${ui.aiOn ? "" : "off"}" data-act="ai-toggle" title="Turn AI off">AI<i></i></button>
      <button class="foot-btn" data-act="close-ask" title="Close (Esc)">${ico("x")}</button></div>
    <div class="ask-scroll" id="askscroll">
      <div class="ask-hint">Answers only from your notes and cites each one. Never edits.</div>
      ${th.map((t) => `<div class="q">${esc(t.q)}</div><div class="a">
        ${t.none ? `<div class="label">Not in your notes</div>` : ""}${t.a}
        ${t.srcs.length ? `<div class="srcs">${t.srcs.map(([id, quote], i) => { const s = byId[id]; return `<button class="src-card" data-go="${id}"><span class="n">${i + 1}</span>${shapeSVG(s, .82)}<span><span class="t">${esc(s.title)}</span><span class="quote">“${esc(quote)}”</span></span></button>`; }).join("")}</div>` : ""}
        <div class="ask-meta">${t.meta}</div></div>`).join("")}
    </div>
    <div class="ask-input"><form id="askform"><input id="askq" placeholder="Ask about your notes…" autocomplete="off"><button class="send" aria-label="Ask">${ico("arrowUp")}</button></form>
      <div class="foot"><span>Claude · your subscription</span><span>no extra cost</span></div></div>`;
  const sc = $("#askscroll"); sc.scrollTop = sc.scrollHeight;
}

function renderBoard(main) {
  const withTasks = notes.filter((n) => n.tasks.total).sort((a, b) => b.updated - a.updated);
  const shown = withTasks;
  const items = (n, done) => n.blocks.filter((b) => b.task).flatMap((b) => b.items.map((it, i) => ({ b, it, i })).filter((x) => !!x.it.checked === done));
  const tcard = (n, done) => {
    const its = items(n, done); if (!its.length) return "";
    return `<div class="tcard"><button class="tcard-h" data-go="${n.id}">${shapeSVG(n, .82)}<span class="t">${esc(n.title)}</span><span class="p">${progress(n)}</span></button>
      ${its.map(({ b, it, i }) => `<div class="titem ${done ? "done" : ""}"><button class="cb ${done ? "on" : ""}" data-toggle="${n.id}|${b.id}|${i}" aria-label="Toggle">${done ? ico("check") : ""}</button>
        <button class="txt" data-line="${n.id}|${b.id}-${i}" title="Open the line in its note">${esc(inlineText(itemContent(it)))}</button><span class="jump">${ico("jump", "ico-s")}</span></div>`).join("")}
      <div class="tnb">${esc(nbById[n.nb].name)}</div></div>`;
  };
  const openN = shown.reduce((a, n) => a + n.tasks.total - n.tasks.done, 0), doneN = shown.reduce((a, n) => a + n.tasks.done, 0);
  main.innerHTML = `<div class="board">
    <div class="board-head"><h1>Tasks</h1><span class="sub">from checklists in ${shown.length} notes · each links back to its line</span></div>
    <div class="cols">
      <section class="col"><div class="col-h">To do <span class="count num">${openN}</span></div><div class="col-grid">${shown.map((n) => tcard(n, false)).join("")}</div></section>
      <section class="col done"><div class="col-h">Done <span class="count num">${doneN}</span></div><div class="col-grid">${shown.map((n) => tcard(n, true)).join("")}</div></section>
    </div></div>`;
}

function renderConflict(main, n) {
  const base = JSON.parse(ORIGINAL["fx-note-29"]).find((b) => b.task).items.map((i) => [inlineText(i.content), i.checked]);
  const mac = [["Bread", 1], ["Leeks", 1], ["Carrots", 0], ["Cream", 0], ["Fresh fish", 0], ["Coffee", 1], ["Butter", 0]];
  const phone = [["Bread", 1], ["Leeks", 0], ["Carrots", 1], ["Cream", 0], ["Fresh cod", 0], ["Coffee", 1], ["Lemons", 0]];
  const mark = (v) => v.map(([t, c], i) => {
    const b = base[i]; const added = !b; const changed = b && (b[0] !== t || !!b[1] !== !!c);
    const tag = added ? "added" : changed ? (b[0] !== t ? "renamed" : c ? "checked" : "unchecked") : "";
    return `<div class="vi ${added ? "added" : changed ? "changed" : ""}"><span class="cb ${c ? "on" : ""}">${c ? ico("check") : ""}</span><span>${esc(t)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</div>`;
  }).join("");
  const fake = (items) => ({ blocks: [{ type: "paragraph", content: [{ type: "text", value: "x" }] }, { type: "list", task: true, items: items.map(([t, c]) => ({ checked: !!c, content: [] })) }] });
  const ver = (who, whenTxt, items, id) => `<section class="ver"><div class="ver-h">${shapeSVG(fake(items), 1.1)}<span><div class="who">${who}</div><div class="when">${whenTxt}</div></span></div>
    <div class="ver-b"><p>The usual, plus things for Sunday dinner.</p>${mark(items)}</div>
    <div class="ver-f"><button class="btn" data-act="resolve" data-keep="${id}">Keep this version</button></div></section>`;
  main.innerHTML = topBar(n) + `<div class="doc-wrap"><div class="doc-grid narrow" style="grid-template-columns:minmax(0,860px)"><article class="doc">
    <div class="conflict-head">${ico("cloudOff")}<span class="grow"><b>Edited in two places while offline.</b> Both versions are kept until you choose.</span><button class="btn primary" data-act="resolve" data-keep="both">Merge both</button></div>
    <h1 class="doc-title">${esc(n.title)}</h1><div class="doc-meta">Changes since the last sync, side by side</div>
    <div class="versions">${ver("This Mac", "Today 14:02 · offline edit", mac, "mac")}${ver("iPhone", "Today 14:05 · offline edit", phone, "phone")}</div>
    <div class="legend"><span><i style="background:var(--warn-soft)"></i>changed</span><span><i style="background:var(--ins-bg)"></i>added</span><span>Nothing is lost: the version you don’t keep stays in history.</span></div>
  </article></div></div>`;
}
function resolveConflict(keep) {
  const n = byId["fx-note-29"]; const list = n.blocks.find((b) => b.task);
  const merged = { mac: [["Bread", 1], ["Leeks", 1], ["Carrots", 0], ["Cream", 0], ["Fresh fish", 0], ["Coffee", 1], ["Butter", 0]],
    phone: [["Bread", 1], ["Leeks", 0], ["Carrots", 1], ["Cream", 0], ["Fresh cod", 0], ["Coffee", 1], ["Lemons", 0]],
    both: [["Bread", 1], ["Leeks", 1], ["Carrots", 1], ["Cream", 0], ["Fresh cod", 0], ["Coffee", 1], ["Butter", 0], ["Lemons", 0]] }[keep];
  list.items = merged.map(([t, c]) => ({ content: [{ type: "text", value: t }], checked: !!c }));
  derive(n); ui.conflictResolved = true;
  toast(keep === "both" ? "Merged both versions." : `Kept the ${keep === "mac" ? "Mac" : "iPhone"} version. The other is in history.`);
  writeHash({ conf: false });
}

function renderMobile() {
  const noteOpen = !!(S.n && S.mn);
  $("#mhead").innerHTML = S.ask ? `<h1><span class="spark">${ico("spark")}</span> Ask</h1>` : S.v === "tasks" ? `<h1>Tasks</h1>`
    : noteOpen ? `<button class="back" data-act="m-back">${ico("back")}${esc(scopeName())}</button><span class="right"><button>${ico("dots")}</button></span>`
    : `<h1>${esc(scopeName())} ${ico("down", "ico-s")}</h1><span class="right"><button aria-label="New note">${ico("plus")}</button></span>`;
  const tab = (id, label, icon, cur) => `<button data-act="${id}" aria-current="${cur}">${icon}${label}</button>`;
  $("#tabs").innerHTML = tab("m-notes", "Notes", ico("notes"), S.v !== "tasks" && !S.ask) + tab("tasks", "Tasks", ico("tasks"), S.v === "tasks") + tab("m-ask", "Ask", `<span class="spark">${ico("spark")}</span>`, S.ask) + tab("m-nb", "Notebooks", ico("book"), false);
}

const $ = (s) => document.querySelector(s);
function render() {
  const app = $("#app");
  const narrow = window.innerWidth < 720;
  const mobile = S.m || narrow;
  document.body.classList.toggle("preview-mobile", S.m && !narrow && window.innerHeight > 860);
  app.className = "app" + (S.ask && !mobile ? " has-ask" : "") + (S.v === "tasks" ? " is-board" : "") + (S.off ? " is-offline" : "") + (mobile ? " is-mobile" : "") + (mobile && S.mn ? " m-note" : "") + (mobile && S.ask ? " m-ask" : "");
  $("#banner").innerHTML = `${ico("cloudOff", "ico-s")}<span>Offline. Edits save on this Mac and sync when you’re back.</span><span class="right num">3 edits waiting</span>`;
  renderSide(); renderList(); renderMain(); renderAsk(); if (mobile) renderMobile();
  $("#states").innerHTML = `<span class="lbl">${S.s ? esc(PRESETS[S.s].label) : "States"}</span>` + Object.keys(PRESETS).map((k) => `<button data-state="${k}" title="${k} · ${esc(PRESETS[k].label)}" aria-current="${S.s === +k}">${k}</button>`).join("");
  if (S.s === 1 && !ui.focused) { ui.focused = true; $("#cards").focus({ preventScroll: true }); }
  if (S.focus && !ui.focused) { ui.focused = true; const p = document.getElementById("b-fx-note-00-p1"); if (p) { p.focus(); const r = document.createRange(); r.selectNodeContents(p); r.collapse(false); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } }
  if (ui.toast) showToast();
}
function toast(msg, undo) { ui.toast = { msg, undo, t: Date.now() }; }
function showToast() {
  document.querySelector(".toast")?.remove();
  const t = ui.toast; const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span>${esc(t.msg)}</span>${t.undo ? `<button data-act="${t.undo}">Undo</button>` : ""}`;
  document.body.appendChild(el); ui.toast = null; setTimeout(() => el.remove(), 3200);
}

function openNote(id, extra = {}) { writeHash({ n: id, line: null, focus: false, edit: false, mn: true, ...extra }); }
function move(delta) {
  const list = visibleNotes(); if (!list.length) return;
  let i = list.findIndex((n) => n.id === S.n); i = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + delta));
  writeHash({ n: list[i].id, line: null, focus: false, edit: false }, true);
  document.getElementById("c-" + list[i].id)?.scrollIntoView({ block: "nearest" });
  $("#cards").focus({ preventScroll: true });
}
function toggleItem(spec) {
  const [nid, bid, i] = spec.split("|"); const n = byId[nid]; const b = n.blocks.find((x) => x.id === bid);
  b.items[+i].checked = !b.items[+i].checked; n.updated = NOW; derive(n); render();
}
function syncFromDom(el) {
  const n = byId[el.closest("[data-doc]")?.dataset.doc]; if (!n) return;
  const b = n.blocks.find((x) => x.id === el.dataset.block); if (!b) return;
  const content = [...el.childNodes].map((c) => c.nodeType === 3 ? { type: "text", value: c.textContent }
    : c.classList?.contains("wikilink") ? { type: "wikilink", docId: c.dataset.go, target: c.dataset.go, children: [{ type: "text", value: c.textContent }] } : { type: "text", value: c.textContent });
  if (b.type === "heading") b.text = el.textContent;
  else if (el.dataset.item != null) { const it = b.items[+el.dataset.item]; if (Array.isArray(it)) b.items[+el.dataset.item] = content; else it.content = content; }
  else b.content = content;
  n.updated = NOW; derive(n); refreshCard(n);
}
function refreshCard(n) {
  const old = document.getElementById("c-" + n.id); if (!old) return;
  const tmp = document.createElement("div"); tmp.innerHTML = cardHTML(n, S.nb === "all" || !!S.q); old.replaceWith(tmp.firstElementChild);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-state],[data-nb],[data-note],[data-go],[data-act],[data-toggle],[data-hunk],[data-scroll],[data-line]");
  if (!t) { if (ui.aiMenu) { ui.aiMenu = false; render(); } return; }
  if (t.dataset.state) return setPreset(+t.dataset.state);
  if (t.dataset.toggle) return toggleItem(t.dataset.toggle);
  if (t.dataset.nb) return writeHash({ v: "notes", nb: t.dataset.nb, q: "", n: visibleNotesFor(t.dataset.nb)[0]?.id || null, line: null, edit: false, mn: false });
  if (t.dataset.go) return openNote(t.dataset.go, S.v === "tasks" ? { v: "notes", nb: "all" } : {});
  if (t.dataset.line) { const [nid, line] = t.dataset.line.split("|"); return writeHash({ v: "notes", nb: byId[nid].nb, n: nid, line, mn: true }); }
  if (t.dataset.note) return writeHash({ n: t.dataset.note, line: null, focus: false, edit: false, mn: true });
  if (t.dataset.scroll) return document.getElementById(t.dataset.scroll)?.scrollIntoView({ behavior: "smooth", block: "start" });
  if (t.dataset.hunk) { const [i, st] = t.dataset.hunk.split("|"); ui.hunks[+i].state = st; if (ui.hunks.every((h) => h.state)) applyHunks(); return render(); }
  const a = t.dataset.act;
  if (a === "theme") return setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  if (a === "tasks") return writeHash({ v: "tasks", ask: false, mn: false });
  if (a === "m-notes") return writeHash({ v: "notes", mn: false, ask: false });
  if (a === "m-back") return writeHash({ mn: false });
  if (a === "m-ask") { ui.askThread = ui.askThread || seededThread(); return writeHash({ ask: true, mn: false }); }
  if (a === "ai-menu") { ui.aiMenu = !ui.aiMenu; return render(); }
  if (a === "open-ask") { ui.aiMenu = false; ui.askThread = ui.askThread || []; return writeHash({ ask: true }); }
  if (a === "open-edit") { ui.aiMenu = false; ui.hunks = null; return writeHash({ nb: "fx-nb-projects", n: "fx-note-00", edit: true }); }
  if (a === "close-ask") return writeHash({ ask: false });
  if (a === "ai-toggle") { ui.aiOn = !ui.aiOn; if (!ui.aiOn) return writeHash({ ask: false, edit: false }); return render(); }
  if (a === "edit-all-ok" || a === "edit-all-no") { ui.hunks.forEach((h) => { if (!h.state) h.state = a === "edit-all-ok" ? "acc" : "rej"; }); applyHunks(); return render(); }
  if (a === "edit-undo") { if (ui.editUndo) { byId["fx-note-00"].blocks = JSON.parse(ui.editUndo); derive(byId["fx-note-00"]); } ui.hunks = null; ui.editUndo = null; toast("AI edit undone."); return writeHash({ edit: false }); }
  if (a === "edit-close") { ui.hunks = null; ui.editUndo = null; return writeHash({ edit: false }); }
  if (a === "resolve") return resolveConflict(t.dataset.keep);
});
function visibleNotesFor(nb) { const save = S; S = { ...S, nb, q: "" }; const l = visibleNotes(); S = save; return l; }
document.addEventListener("input", (e) => {
  if (e.target.id === "q") return writeHash({ q: e.target.value, s: S.s }, true);
  if (e.target.dataset.title) { const n = byId[e.target.dataset.title]; n.title = e.target.textContent; n.updated = NOW; derive(n); return refreshCard(n); }
  if (e.target.dataset.block) syncFromDom(e.target);
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "askform") return; e.preventDefault();
  const q = $("#askq").value.trim(); if (!q) return;
  ui.askThread = [...(ui.askThread || []), localAnswer(q)]; renderAsk(); $("#askq").focus();
});
document.addEventListener("keydown", (e) => {
  const typing = e.target.isContentEditable || /INPUT|TEXTAREA/.test(e.target.tagName);
  if (e.key === "Escape") {
    if (ui.aiMenu) { ui.aiMenu = false; return render(); }
    if (e.target.id === "q" && S.q) return writeHash({ q: "" }, true);
    if (typing) { e.target.blur(); return $("#cards")?.focus(); }
    if (S.ask) return writeHash({ ask: false });
    return;
  }
  if (e.target.id === "q" && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); return move(e.key === "ArrowDown" ? 1 : -1); }
  if (e.target.id === "q" && e.key === "Enter") { const f = visibleNotes()[0]; if (f) openNote(S.n || f.id); return; }
  if (typing) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= "1" && e.key <= "8") return setPreset(+e.key);
  if (e.key === "ArrowDown") { e.preventDefault(); return move(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); return move(-1); }
  if (e.key === "/") { e.preventDefault(); return $("#q").focus(); }
  if (e.key === "Enter" && S.n) { e.preventDefault(); const p = $(".body [contenteditable]"); p?.focus(); return; }
  if (e.key === "t") return setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem("bk-theme", t); } catch {} render(); }
window.addEventListener("hashchange", () => { S = readHash(); render(); });
window.addEventListener("resize", () => render());
(function boot() {
  let theme = new URLSearchParams(location.search).get("theme");
  if (!theme) { try { theme = localStorage.getItem("bk-theme"); } catch {} }
  if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  if (!location.hash) history.replaceState(null, "", "#" + PRESETS[1].hash);
  S = readHash(); if (S.s === 3) ui.askThread = seededThread();
  render();
})();
</script>
</body>
