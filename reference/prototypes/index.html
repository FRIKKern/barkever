<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2 Prototypes</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
  --accent: #2f6f5e; --accent-text: #ffffff; --win: #2f6f5e; --shade: #efeee9;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --card: #1f1f1d; --text: #ecebe7; --muted: #9a9993; --line: #33322f;
    --accent: #6cc3a8; --accent-text: #10201b; --win: #6cc3a8; --shade: #272724;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --card: #1f1f1d; --text: #ecebe7; --muted: #9a9993; --line: #33322f;
  --accent: #6cc3a8; --accent-text: #10201b; --win: #6cc3a8; --shade: #272724;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
h1 { font-size: 16px; margin: 0; font-weight: 650; }
.hint { color: var(--muted); font-size: 12px; margin-left: auto; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
main.focus { grid-template-columns: 1fr; }
main.focus .card:not(.on) { display: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.card.win { border-color: var(--win); box-shadow: 0 0 0 1px var(--win); }
.head { display: flex; gap: 8px; align-items: baseline; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.head b { font-size: 15px; }
.head .idea { color: var(--muted); font-size: 12px; flex: 1 1 160px; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--shade); color: var(--muted); }
.card.win .badge { background: var(--win); color: var(--accent-text); }
.head a { color: var(--accent); text-decoration: none; font-size: 12px; white-space: nowrap; }
.shot { background: var(--shade); display: flex; align-items: center; justify-content: center; min-height: 220px; }
.shot img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; cursor: zoom-in; }
.shot .none { color: var(--muted); font-size: 13px; padding: 40px 16px; text-align: center; }
.note { padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  header { position: static; }
  .hint { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>P2 prototypes</h1>
  <nav id="journeys" aria-label="Journey"></nav>
  <nav id="protos" aria-label="Prototype"></nav>
  <button id="theme" title="Light or dark">◐</button>
  <span class="hint">← → journey · 1–4 one prototype · 0 all</span>
</header>
<main id="grid"></main>
<script>
const PROTOS = [
  { id: "a-quiet", name: "A · Quiet", idea: "Evernote three panes, calmer", score: 71 },
  { id: "b-cards", name: "B · Cards", idea: "Every note shows its shape", score: 69 },
  { id: "c-map", name: "C · Map", idea: "Link graph rail + notebook map", score: 66, win: true },
  { id: "d-lanes", name: "D · Lanes", idea: "Today / this week / later + project boards", score: 68 },
];
const JOURNEYS = [
  { key: "browse", label: "J02 Browse", shots: { "a-quiet": "01-browse", "b-cards": "01-browse", "c-map": "01-browse", "d-lanes": "01-home" } },
  { key: "note", label: "J05 Note + links", shots: { "a-quiet": "02-note", "b-cards": "02-note", "c-map": "02-note-graph", "d-lanes": "02-note" } },
  { key: "ask", label: "J07 Ask", shots: { "a-quiet": "03-ask", "b-cards": "03-ask", "c-map": "03-ask", "d-lanes": "03-ask" } },
  { key: "edit", label: "J08 AI Edit", shots: { "a-quiet": "04-ai-edit", "b-cards": "04-ai-edit", "c-map": "04-ai-edit", "d-lanes": "04-ai-edit" } },
  { key: "plan", label: "J06 Plan", shots: { "a-quiet": "05-tasks", "b-cards": "05-tasks", "c-map": "05-tasks", "d-lanes": "05-board" } },
  { key: "offline", label: "J10 Offline", shots: { "a-quiet": "06-offline" } },
  { key: "conflict", label: "J10 Conflict", shots: { "a-quiet": "07-conflict", "b-cards": "07-conflict", "c-map": "07-conflict", "d-lanes": "07-conflict" } },
  { key: "mobile", label: "Mobile", shots: { "a-quiet": "08-mobile", "b-cards": "08-mobile", "c-map": "08-mobile", "d-lanes": "08-mobile" } },
  { key: "dark", label: "Dark", shots: { "a-quiet": "02-note-dark", "b-cards": "02-note-dark", "c-map": "02-note-graph-dark", "d-lanes": "01-home-dark" } },
  { key: "map", label: "C only: full map", shots: { "c-map": "09-map" } },
];
const NOTES = {
  offline: "Only A has an offline screenshot. B, C and D have the state live: open it and press 6.",
  plan: "All four were built on fixtures where every checklist read First step / Second step / Follow up. B's overlay.mjs gave it real items; D invents due dates in plan.mjs.",
  browse: "B's thumbnails and headings come from overlay.mjs, extra data the others did not get.",
};
const st = { j: 0, focus: null };
try { const s = JSON.parse(localStorage.getItem("p2-judge") || "{}"); if (s.j >= 0 && s.j < JOURNEYS.length) st.j = s.j; if (PROTOS.some((p) => p.id === s.focus)) st.focus = s.focus; } catch (e) {}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const j = JOURNEYS[st.j];
  $("#journeys").innerHTML = JOURNEYS.map((x, i) => `<button data-j="${i}" aria-pressed="${i === st.j}">${esc(x.label)}</button>`).join("");
  $("#protos").innerHTML = `<button data-f="" aria-pressed="${!st.focus}">All</button>` + PROTOS.map((p) => `<button data-f="${p.id}" aria-pressed="${st.focus === p.id}">${esc(p.name.split(" ")[0])}</button>`).join("");
  $("#grid").className = st.focus ? "focus" : "";
  $("#grid").innerHTML = PROTOS.map((p) => {
    const shot = j.shots[p.id];
    const img = shot ? `<a href="${p.id}/${shot}.webp" target="_blank" rel="noopener"><img src="${p.id}/${shot}.webp" alt="${esc(p.name)}: ${esc(j.label)}" loading="lazy"></a>` : `<div class="none">No screenshot for this journey.</div>`;
    return `<section class="card ${p.win ? "win" : ""} ${st.focus === p.id ? "on" : ""}">
      <div class="head"><b>${esc(p.name)}</b><span class="idea">${esc(p.idea)}</span><span class="badge">${p.win ? "owner pick · " : ""}${p.score}/85</span><a href="${p.id}/index.html" target="_blank" rel="noopener">Open live ↗</a></div>
      <div class="shot">${img}</div></section>`;
  }).join("") + (NOTES[j.key] ? `<div class="note" style="grid-column:1/-1">${esc(NOTES[j.key])}</div>` : "");
  try { localStorage.setItem("p2-judge", JSON.stringify(st)); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "theme") { const d = document.documentElement; const dark = d.dataset.theme ? d.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme = dark ? "light" : "dark"; return; }
  if (b.dataset.j != null) st.j = +b.dataset.j;
  if (b.dataset.f != null) st.focus = b.dataset.f || null;
  render();
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") st.j = (st.j + 1) % JOURNEYS.length;
  else if (e.key === "ArrowLeft") st.j = (st.j + JOURNEYS.length - 1) % JOURNEYS.length;
  else if (/^[1-4]$/.test(e.key)) st.focus = PROTOS[+e.key - 1].id;
  else if (e.key === "0") st.focus = null;
  else return;
  render();
});
render();
</script>
</body>
</html>
