<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barkever · A Quiet</title>
<style>
:root{
  --c-bg:#ffffff; --c-sidebar:#f5f4f0; --c-list:#ffffff; --c-editor:#ffffff; --c-raised:#ffffff;
  --c-sunken:#f0eee9; --c-hover:rgba(40,36,28,.045); --c-active:rgba(40,36,28,.08); --c-sel:#edf3f0;
  --c-text:#1c1b19; --c-text-2:#56534d; --c-text-3:#8a867e; --c-text-inv:#ffffff;
  --c-line:#e8e5df; --c-line-2:#d6d2ca;
  --c-accent:#1f6f5c; --c-accent-hover:#195c4c; --c-accent-soft:#e3efea; --c-accent-text:#1a6150;
  --c-ins-bg:#d9f0df; --c-ins-fg:#155c2c; --c-del-bg:#fbe2dd; --c-del-fg:#9e2618;
  --c-warn:#b7860f; --c-warn-soft:#faf3e1; --c-mark:#fbeaa0;
  --c-backdrop:#e6e3dd; --c-toast:#262522; --c-toast-text:#f4f2ee;
  --shadow-1:0 1px 2px rgba(20,18,15,.06),0 3px 10px rgba(20,18,15,.06);
  --shadow-2:0 12px 40px rgba(20,18,15,.16),0 2px 6px rgba(20,18,15,.06);

  --f-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-2xs:10.5px; --fs-xs:11.5px; --fs-sm:12.5px; --fs-md:13.5px; --fs-base:14px;
  --fs-body:15.5px; --fs-lg:18px; --fs-xl:21px; --fs-2xl:26px; --fs-title:30px;
  --lh-body:1.65; --fw-med:510; --fw-semi:600; --fw-bold:690; --ls-caps:.07em; --ls-tight:-.015em;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px;
  --r-xs:3px; --r-sm:5px; --r-md:7px; --r-lg:10px; --r-xl:14px; --r-full:999px;

  --w-sidebar:240px; --w-list:340px; --w-ask:376px; --w-read:700px;
  --h-row:98px; --h-bar:48px; --h-tool:40px; --h-foot:44px; --dur:140ms;
}
:root[data-theme=dark]{
  --c-bg:#191918; --c-sidebar:#131312; --c-list:#191918; --c-editor:#1b1b1a; --c-raised:#232321;
  --c-sunken:#262624; --c-hover:rgba(255,250,240,.045); --c-active:rgba(255,250,240,.08); --c-sel:#1f2b27;
  --c-text:#ebe9e4; --c-text-2:#aaa69e; --c-text-3:#77736c; --c-text-inv:#0f1d19;
  --c-line:#2a2a28; --c-line-2:#3a3936;
  --c-accent:#5dbea2; --c-accent-hover:#74cbb2; --c-accent-soft:rgba(93,190,162,.14); --c-accent-text:#7fd0b8;
  --c-ins-bg:rgba(80,180,110,.2); --c-ins-fg:#9adfae; --c-del-bg:rgba(235,95,75,.2); --c-del-fg:#f3a497;
  --c-warn:#d9a93a; --c-warn-soft:rgba(217,169,58,.12); --c-mark:rgba(250,210,80,.3);
  --c-backdrop:#0e0e0d; --c-toast:#ebe9e4; --c-toast-text:#191918;
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 3px 10px rgba(0,0,0,.3);
  --shadow-2:0 12px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--c-bg);color:var(--c-text);font:var(--fs-base)/1.45 var(--f-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
mark{background:var(--c-mark);color:inherit;border-radius:2px;padding:0 1px}
.muted{color:var(--c-text-3)}
.kbd{font:500 var(--fs-2xs)/1 var(--f-sans);color:var(--c-text-3);border:1px solid var(--c-line-2);border-radius:4px;padding:2px 4px}
.caps{font-size:var(--fs-2xs);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--c-text-3);font-weight:var(--fw-semi)}
.btn{height:30px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--c-line-2);background:var(--c-raised);font-size:var(--fs-md);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--c-sunken)}
.btn.primary{background:var(--c-accent);border-color:transparent;color:var(--c-text-inv);font-weight:var(--fw-semi)}
.btn.primary:hover{background:var(--c-accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--c-text-2)}
.btn.ghost:hover{background:var(--c-hover)}
.btn.sm{height:26px;padding:0 9px;font-size:var(--fs-sm)}
.ib{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-md);border:0;background:transparent;color:var(--c-text-2);cursor:pointer;padding:0}
.ib:hover{background:var(--c-hover);color:var(--c-text)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-full);background:var(--c-sunken);color:var(--c-text-2);font-size:var(--fs-sm);border:0;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--c-text)}
.chip svg.i{width:13px;height:13px}
.chip.accent{background:var(--c-accent-soft);color:var(--c-accent-text);font-weight:var(--fw-med)}
.app{display:grid;grid-template-columns:var(--w-sidebar) var(--w-list) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;position:relative;overflow:hidden;background:var(--c-bg)}
#offline{grid-column:1/-1}
.app.wide{grid-template-columns:var(--w-sidebar) minmax(0,1fr)}
.app.wide .list,.app.wide .ed{display:none}
.app:not(.wide) .wide-pane{display:none}
.m-only{display:none!important}

.offline{display:flex;align-items:center;gap:10px;height:30px;padding:0 16px;background:var(--c-warn-soft);border-bottom:1px solid var(--c-line);font-size:var(--fs-sm);color:var(--c-text-2)}
.offline b{color:var(--c-text);font-weight:var(--fw-semi)}
.offline .btn{margin-left:auto;height:22px;font-size:var(--fs-xs)}
.sb{background:var(--c-sidebar);border-right:1px solid var(--c-line);display:flex;flex-direction:column;min-height:0}
.acct{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;font-weight:var(--fw-semi);font-size:var(--fs-md)}
.avatar{width:24px;height:24px;border-radius:var(--r-full);background:var(--c-accent);color:var(--c-text-inv);font-size:10px;font-weight:700;display:grid;place-items:center;letter-spacing:.02em}
.acct .ib{margin-left:auto;width:26px;height:26px}
.search{margin:6px 12px 0;display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border-radius:var(--r-md);background:var(--c-raised);border:1px solid var(--c-line);color:var(--c-text-3)}
.search:focus-within{border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
.search input{border:0;background:transparent;flex:1;min-width:0;font:inherit;font-size:var(--fs-md);color:var(--c-text);outline:none}
.search input::placeholder{color:var(--c-text-3)}
.new{margin:10px 12px 8px;height:34px;width:calc(100% - 24px);border-radius:var(--r-md);background:var(--c-accent);color:var(--c-text-inv);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:var(--fw-semi);font-size:var(--fs-md);border:0;cursor:pointer}
.new:hover{background:var(--c-accent-hover)}
.new .kbd{margin-left:auto;color:inherit;opacity:.7;border-color:currentColor}
.sb-scroll{flex:1;overflow:auto;padding:4px 8px 16px}
.nav{display:flex;align-items:center;gap:10px;height:29px;padding:0 8px 0 10px;border-radius:var(--r-sm);color:var(--c-text-2);cursor:pointer;font-size:var(--fs-md);user-select:none;white-space:nowrap}
.nav:hover{background:var(--c-hover);color:var(--c-text)}
.nav.on{background:var(--c-active);color:var(--c-text);font-weight:var(--fw-semi)}
.nav>svg.i{color:var(--c-text-3)}
.nav.on>svg.i{color:var(--c-accent)}
.nav .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav .count{margin-left:auto;font-size:var(--fs-xs);color:var(--c-text-3);font-variant-numeric:tabular-nums;font-weight:400}
.nav .tw{width:14px;display:grid;place-items:center;margin-left:-4px;margin-right:-6px;color:var(--c-text-3)}
.nav .tw svg.i{width:12px;height:12px}
.nav.sub{padding-left:34px}
.nav.recent{font-size:var(--fs-sm)}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 10px 4px}
.sec-h .ib{width:20px;height:20px}
.sec-h .ib svg.i{width:13px;height:13px}
.sb-foot{display:flex;align-items:center;gap:8px;padding:10px 16px 42px;border-top:1px solid var(--c-line);font-size:var(--fs-xs);color:var(--c-text-3)}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--c-accent)}
.sb-foot .dot.off{background:var(--c-warn)}
.list{background:var(--c-list);border-right:1px solid var(--c-line);display:flex;flex-direction:column;min-height:0}
.list-h{padding:16px 16px 12px 20px;border-bottom:1px solid var(--c-line)}
.list-h .top{display:flex;align-items:center;gap:4px}
.list-h h1{font-size:var(--fs-xl);font-weight:var(--fw-bold);margin:0;letter-spacing:var(--ls-tight);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-h .sub{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--c-text-3);font-size:var(--fs-sm)}
.list-h .sub .chip{height:20px;font-size:var(--fs-xs)}
.rows{flex:1;overflow:auto;overscroll-behavior:contain}
.grp{position:sticky;top:0;z-index:1;background:var(--c-list);padding:12px 20px 5px;border-bottom:1px solid var(--c-line)}
.row{position:relative;height:var(--h-row);padding:11px 18px 0 20px;border-bottom:1px solid var(--c-line);cursor:pointer;overflow:hidden}
.row:hover{background:var(--c-hover)}
.row.on{background:var(--c-sel)}
.row.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c-accent)}
.row-meta{display:flex;gap:5px;align-items:center;font-size:var(--fs-xs);color:var(--c-text-3);height:16px;white-space:nowrap}
.row-meta .nb{color:var(--c-text-2);font-weight:var(--fw-med)}
.row-meta .ind{margin-left:auto;display:flex;gap:10px;align-items:center}
.row-meta .ind span{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.row-meta .ind svg.i{width:12px;height:12px}
.row-t{font-size:var(--fs-base);font-weight:var(--fw-semi);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.003em}
.row-s{font-size:var(--fs-sm);color:var(--c-text-2);line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.empty{padding:40px 24px;text-align:center;color:var(--c-text-3);font-size:var(--fs-md)}
.empty svg.i{width:28px;height:28px;display:block;margin:0 auto 10px;stroke-width:1.3}
.ed{display:flex;min-width:0;min-height:0;overflow:hidden;background:var(--c-editor)}
.ed-main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.ed-top{height:var(--h-bar);flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 20px;border-bottom:1px solid var(--c-line)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--c-text-2);font-size:var(--fs-md);min-width:0;white-space:nowrap}
.crumb a{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.crumb a:hover{color:var(--c-text)}
.crumb svg.i{color:var(--c-text-3);width:15px;height:15px}
.crumb .sep{color:var(--c-line-2)}
.crumb .cur{color:var(--c-text);font-weight:var(--fw-med)}
.ed-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.ed-actions .who{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--c-text-3);margin-right:6px}
.tool{height:var(--h-tool);flex:none;display:flex;align-items:center;gap:1px;padding:0 12px;border-bottom:1px solid var(--c-line);overflow:hidden;white-space:nowrap}
.tool .div{width:1px;height:18px;background:var(--c-line);margin:0 7px;flex:none}
.tb{height:28px;min-width:28px;padding:0 7px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--c-text-2);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-size:var(--fs-md);flex:none}
.tb:hover{background:var(--c-hover);color:var(--c-text)}
.tb.lead{color:var(--c-text);font-weight:var(--fw-semi)}
.tb.lead svg.i{color:var(--c-accent)}
.tb.drop::after{content:"";width:0;height:0;border:3.5px solid transparent;border-top:4px solid currentColor;margin-top:4px;opacity:.6}
.tb.on{background:var(--c-accent-soft);color:var(--c-accent-text)}
.tb b,.tb i,.tb u,.tb s{font-size:14px;width:12px;text-align:center}
.menu{position:absolute;z-index:20;background:var(--c-raised);border:1px solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:6px;min-width:210px}
.menu .mi{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-md);color:var(--c-text)}
.menu .mi:hover{background:var(--c-hover)}
.menu .mi svg.i{color:var(--c-text-3)}
.menu .mi .kbd{margin-left:auto}
.ed-scroll{flex:1;overflow:auto;min-height:0}
.doc{max-width:var(--w-read);margin:0 auto;padding:34px 48px 120px}
.title{font-size:var(--fs-title);font-weight:var(--fw-bold);letter-spacing:-.022em;line-height:1.18;margin:0 0 12px;outline:none}
.title:empty::before{content:"Untitled";color:var(--c-text-3)}
.doc-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;color:var(--c-text-3);font-size:var(--fs-sm);margin-bottom:28px}
.doc-meta .sep{width:3px;height:3px;border-radius:50%;background:var(--c-line-2)}
.progress{display:inline-flex;align-items:center;gap:7px}
.bar{width:44px;height:4px;border-radius:2px;background:var(--c-sunken);overflow:hidden;display:inline-block}
.bar>i{display:block;height:100%;background:var(--c-accent);border-radius:2px}
.body{font-size:var(--fs-body);line-height:var(--lh-body);outline:none;caret-color:var(--c-accent)}
.body h2{font-size:var(--fs-lg);font-weight:var(--fw-bold);letter-spacing:-.01em;margin:0 0 6px;line-height:1.35}
.body h3{font-size:var(--fs-body);font-weight:var(--fw-bold);margin:0 0 4px}
.body p{margin:0 0 12px}
.body ul.bl{margin:0 0 14px;padding-left:22px}
.body ul.bl li{padding:1px 0}
.body ul.bl li::marker{color:var(--c-text-3)}
.cl{list-style:none;padding:0;margin:4px 0 16px}
.cl li{display:flex;gap:11px;align-items:flex-start;padding:2px 0}
.cb{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--c-line-2);margin-top:5px;flex:none;display:grid;place-items:center;background:var(--c-raised);cursor:pointer;padding:0;color:var(--c-text-inv)}
.cb:hover{border-color:var(--c-accent)}
.cb svg.i{width:12px;height:12px;stroke-width:2.4;opacity:0}
.cb.on{background:var(--c-accent);border-color:var(--c-accent)}
.cb.on svg.i{opacity:1}
.cl li.done>span{color:var(--c-text-3);text-decoration:line-through;text-decoration-color:var(--c-line-2)}
.wl{color:var(--c-accent-text);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--c-accent) 35%,transparent);cursor:pointer;white-space:nowrap}
.wl:hover{border-bottom-color:var(--c-accent)}
.wl svg.i{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
[data-b]{border-radius:var(--r-sm);transition:background 1.2s}
.flash{background:var(--c-mark)!important;transition:none}
.linked{margin-top:44px;padding-top:16px;border-top:1px solid var(--c-line)}
.linked .caps{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.lcard{border:1px solid var(--c-line);border-radius:var(--r-lg);padding:10px 12px 11px;cursor:pointer;background:var(--c-raised);min-width:0}
.lcard:hover{border-color:var(--c-line-2);box-shadow:var(--shadow-1)}
.lcard .t{font-weight:var(--fw-semi);font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .m{font-size:var(--fs-xs);color:var(--c-text-3);margin-bottom:3px}
.lcard .s{font-size:var(--fs-sm);color:var(--c-text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;line-height:1.4}
.ed-foot{height:var(--h-foot);flex:none;border-top:1px solid var(--c-line);display:flex;align-items:center;padding:0 16px 0 20px;gap:6px;white-space:nowrap;overflow:hidden}
.ed-foot>svg.i{color:var(--c-text-3);margin-right:4px}
.ed-foot .add{color:var(--c-text-3);background:transparent;border:1px dashed var(--c-line-2)}
.saved{margin-left:auto;color:var(--c-text-3);font-size:var(--fs-sm);display:flex;align-items:center;gap:6px}
.saved svg.i{width:14px;height:14px;color:var(--c-accent)}
.saved.off svg.i{color:var(--c-warn)}
.fab{position:absolute;right:22px;bottom:calc(var(--h-foot) + 18px);width:44px;height:44px;border-radius:var(--r-full);background:var(--c-raised);border:1px solid var(--c-line);box-shadow:var(--shadow-1);display:grid;place-items:center;color:var(--c-accent);cursor:pointer;z-index:5;padding:0}
.fab:hover{box-shadow:var(--shadow-2)}
.fab svg.i{width:20px;height:20px}
.fab.on{background:var(--c-accent);color:var(--c-text-inv);border-color:transparent}
.aibar{position:sticky;top:0;z-index:4;background:var(--c-editor);border-bottom:1px solid var(--c-line);padding:10px 20px}
.aibar .r1{display:flex;align-items:center;gap:10px;font-size:var(--fs-md)}
.aibar .r1 svg.i{color:var(--c-accent)}
.aibar .instr{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--c-line-2);border-radius:var(--r-md);background:var(--c-raised);color:var(--c-text);white-space:nowrap;overflow:hidden}
.aibar .r2{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:var(--fs-xs);color:var(--c-text-3)}
.aibar .legend{display:inline-flex;gap:6px;align-items:center}
.aibar .legend del,.aibar .legend ins{font-size:var(--fs-xs)}
del{background:var(--c-del-bg);color:var(--c-del-fg);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c-del-fg) 55%,transparent);border-radius:3px;padding:0 2px}
ins{background:var(--c-ins-bg);color:var(--c-ins-fg);text-decoration:none;border-radius:3px;padding:0 2px}
.hunk{position:relative;display:flex;gap:12px;align-items:flex-start;margin:0 -12px 6px;padding:4px 8px 4px 12px;border-radius:var(--r-md);background:color-mix(in srgb,var(--c-accent-soft) 45%,transparent);box-shadow:inset 2px 0 0 var(--c-accent)}
.hunk .hx{flex:1;min-width:0}
.hunk .hx p{margin:0}
.hunk .hc{flex:none;display:flex;gap:4px;margin-top:2px}
.hc button{height:24px;padding:0 8px;border-radius:var(--r-sm);border:1px solid var(--c-line-2);background:var(--c-raised);cursor:pointer;font-size:var(--fs-xs);display:inline-flex;align-items:center;gap:4px;color:var(--c-text-2)}
.hc button svg.i{width:12px;height:12px;stroke-width:2.2}
.hc .yes:hover{border-color:var(--c-ins-fg);color:var(--c-ins-fg)}
.hc .no:hover{border-color:var(--c-del-fg);color:var(--c-del-fg)}
.hunk.li{margin-left:-12px}

  const ind = (pr ? `<span title="Checklist">${ic("task")}${pr.done}/${pr.all}</span>` : "")
    + (bl ? `<span title="Backlinks">${ic("back")}${bl}</span>` : "");
  const snip = hl(esc(snippet(n, S.q)), S.q) || `<span class="muted">No text yet</span>`;
  return `<div class="row ${S.note === n._id ? "on" : ""}" data-row="${n._id}">
    <div class="row-meta"><span class="nb">${esc(nbName(n.notebook._ref))}</span><span>·</span><span>${shortDate(n.updated)}</span><span class="ind">${ind}</span></div>
    <div class="row-t">${hl(esc(n.title || "Untitled"), S.q)}</div>

function listTitle(count) {
  if (S.q) return ["Search", plural(count, "result"), `<button class="chip" data-act="clearq">“${esc(S.q)}” ${ic("x")}</button>`];
  if (S.view === "shortcuts") return ["Shortcuts", plural(count, "note"), ""];
  if (S.tag) return ["#" + S.tag, plural(count, "note"), `<button class="chip" data-act="cleartag">tag ${ic("x")}</button>`];
  if (S.nb) return [nbName(S.nb), plural(count, "note"), ""];
  return ["Notes", plural(count, "note"), ""];
}

function rowsHTML(list) {
  if (!list.length) return S.q
    ? `<div class="empty">${ic("search")}No notes match “${esc(S.q)}”. Try fewer words.</div>`
    : `<div class="empty">${ic("note")}No notes here yet. Press <span class="kbd">N</span> to write one.</div>`;
  let last = "";
  return list.map((n) => {
    const g = S.view === "shortcuts" ? "" : groupOf(n.updated);
    const head = g && g !== last ? `<div class="grp caps">${g}</div>` : "";
    last = g;
    return head + rowHTML(n);
  }).join("");
}

const tok = (s) => s.match(/\s+|[^\s.,:;!?]+|[.,:;!?]/g) || [];

function wdiff(a, b) {
  const A = tok(a), B = tok(b);
  const L = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
  for (let i = A.length - 1; i >= 0; i--)
    for (let j = B.length - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  const push = (t, s) => (out.at(-1)?.t === t ? (out.at(-1).s += s) : out.push({ t, s }));
  let i = 0, j = 0;
  while (i < A.length || j < B.length) {
    if (i < A.length && j < B.length && A[i] === B[j]) { push("=", A[i++]); j++; }
    else if (j >= B.length || (i < A.length && L[i + 1][j] >= L[i][j + 1])) push("-", A[i++]);
    else push("+", B[j++]);
  }
  const tag = { "=": (s) => s, "-": (s) => `<del>${s}</del>`, "+": (s) => `<ins>${s}</ins>` };
  return out.map((p) => tag[p.t](esc(p.s))).join("");
}

const blockOf = (n, ch) => n.body.blocks.find((x) => x.id === ch.b);
const getText = (n, ch) => inlineText(ch.i == null ? blockOf(n, ch).content : items(blockOf(n, ch))[ch.i].content);

function setText(n, ch, v) {
  const b = blockOf(n, ch), content = [{ type: "text", value: v }];
  if (ch.i == null) b.content = content;
  else b.items[ch.i].content = content;
}

function startEdit(doRender = true) {
  const n = byId[S.note];
  if (n?._id !== EDIT_DEMO.note) {
    toast("AI Edit is scripted for one note in this prototype.", "Open it", () => { applyState(4); });
    return;
  }
  EDIT = { ...EDIT_DEMO, snapshot: JSON.stringify(n.body), changes: EDIT_DEMO.changes.map((c) => ({ ...c, from: getText(n, c), st: "pending" })) };
  S.edit = true;
  S.ask = false;
  if (doRender) go({});
}

function editBarHTML() {
  const count = (st) => EDIT.changes.filter((c) => c.st === st).length;
  const pend = count("pending");
  const r1 = pend
    ? `${ic("pen")}<span class="instr">${esc(EDIT.instr)}</span>
       <button class="btn sm" data-act="rejectall">Reject all</button>
       <button class="btn sm primary" data-act="acceptall">${ic("check")}Accept all ${pend}</button>`
    : `${ic("check")}<span style="flex:1"><b>${count("yes")} accepted</b>, ${count("no")} rejected. Note updated.</span>
       <button class="btn sm" data-act="undoedit">${ic("undo")}Undo AI Edit</button>
       <button class="btn sm primary" data-act="doneedit">Done</button>`;
  return `<div class="aibar"><div class="r1">${r1}</div>

    <span>${EDIT.changes.length} changes, ${pend} to review</span><span class="legend" style="margin-left:auto"><del>removed</del><ins>added</ins></span></div></div>`;
}

function hunkHTML(k, current) {
  const c = EDIT.changes[k];
  if (c.st !== "pending") return `${current}<span class="res">${c.st === "yes" ? "accepted" : "rejected"}</span>`;
  return `<div class="hunk"><span class="n">${k + 1}</span><div class="hx">${wdiff(c.from, c.to)}</div>
    <span class="hc"><button class="yes" data-hunk="${k}|yes">${ic("check")}Accept</button><button class="no" data-hunk="${k}|no">${ic("x")}Reject</button></span></div>`;
}

function editDocHTML(n) {
  const find = (bid, i = null) => EDIT.changes.findIndex((c) => c.b === bid && (c.i ?? null) === i);
  const block = (b) => {
    if (b.type === "paragraph" && find(b.id) >= 0) return `<div class="para" data-b="${b.id}">${hunkHTML(find(b.id), inlineHTML(b.content))}</div>`;
    if (!(b.type === "list" && b.task)) return blockHTML(b, n);
    return `<ul class="cl">${items(b).map((it, i) => {
      const k = find(b.id, i);
      const box = `<button class="cb ${it.checked ? "on" : ""}" data-check="${n._id}|${b.id}|${i}">${ic("check")}</button>`;
      const text = k < 0 ? `<span>${inlineHTML(it.content)}</span>` : hunkHTML(k, `<span>${inlineHTML(it.content)}</span>`);
      return `<li class="${it.checked ? "done" : ""}">${box}${text}</li>`;
    }).join("")}</ul>`;
  };
  return `<div class="doc"><h1 class="title">${esc(n.title)}</h1>
    <div class="doc-meta"><span>Reviewing ${EDIT.changes.length} suggested changes. Nothing is saved until you accept.</span></div>
    <div class="body">${n.body.blocks.map(block).join("")}</div></div>`;
}

function resolveHunk(k, v) {
  const n = byId[EDIT.note], c = EDIT.changes[k];
  if (c.st !== "pending") return;
  c.st = v;
  if (v === "yes") setText(n, c, c.to);
  n.updated = META.now;
  render();
}
const CONFLICT = {

};
let CONFLICT_DONE = false;

function editedAgo(min) {

function versionHTML(side) {

  const task = ([t, done]) => line(`<span class="cb ${done ? "on" : ""}">${ic("check")}</span><span class="${done ? "struck" : ""}">${esc(t)}</span>`, !otherTasks.has(String([t, done])));
  return `<div class="cf-col"><div class="h">${ic(v.icon)}${v.dev}<span>· ${editedAgo(v.ago)}${v.note ? " · " + v.note : ""}</span></div>

    <div class="f"><button class="btn sm" data-keep="${side}">${ic("check")}Keep ${v.dev} version</button></div></div>`;
}

function conflictHTML(n) {
  return `<div class="doc" style="max-width:860px"><h1 class="title">${esc(n.title)}</h1>
    <div class="cf-head">${ic("warn")}<div><b>Edited on two devices while one was offline</b><span>Both versions are kept until you choose. Differences are marked.</span></div></div>

function versionBody(id, v) {
  return { blocks: [
    { id: id + "-p0", type: "paragraph", content: [{ type: "text", value: v.text }] },
    { id: id + "-t", type: "list", ordered: false, task: true, items: v.tasks.map(([t, checked]) => ({ content: [{ type: "text", value: t }], checked })) },
  ] };
}

function keepVersion(side) {
  const n = byId[CONFLICT.note];
  n.body = versionBody(n._id, CONFLICT[side === "both" ? "a" : side]);
  n.updated = META.now;
  if (side === "both") {
    const copy = { ...n, _id: n._id + "-phone", title: n.title + " (Phone)", body: versionBody(n._id + "-phone", CONFLICT.b) };
    NOTES.push(copy);
    byId[copy._id] = copy;
    toast("Kept both. The phone version is a new note.");
  } else toast(`Kept the ${CONFLICT[side].dev} version. The other stays in note history.`, "Undo", () => applyState(7));
  CONFLICT_DONE = true;
  go({ conflict: false });
}

  };
  return wideHead("Tasks", sub, `<div class="seg">${seg}</div><span class="muted" style="font-size:var(--fs-sm)">Grouped by notebook</span>`)
    + `<div class="wide-body"><div class="board">${cols.map(col).join("")}</div></div>`;
}
const EMPTY = {
  home: ["home", "Home", "Recent notes, shortcuts and open tasks gather here as you write."],
  files: ["file", "Files", "No files yet. Drag an image or PDF into any note."],
  calendar: ["cal", "Calendar", "No events yet. Connect a calendar to see meetings next to their notes."],
  templates: ["tpl", "Templates", "No templates yet. Save any note as a template from its ⋯ menu."],
};

function wideHead(title, sub, right = "") {
  return `<div class="mtop m-only"><button class="ib" data-act="drawer">${ic("menu")}</button></div>
    <div class="wide-h"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="right">${right}</div></div>`;
}

function renderWide() {
  const w = $("#wide");
  if (!WIDE.has(S.view)) { w.innerHTML = ""; return; }
  if (S.view === "tasks") { w.innerHTML = tasksHTML(); return; }
  const [icon, title, line] = EMPTY[S.view];
  w.innerHTML = wideHead(title, "") + `<div class="wide-body"><div class="empty" style="margin-top:80px">${ic(icon)}${line}</div></div>`;
}
const isMobile = () => S.frame || window.innerWidth <= 700;

function renderOffline() {
  $("#offline").innerHTML = S.offline
    ? `<div class="offline">${ic("cloudoff")}<b>Offline.</b> Changes are saved on this Mac and sync when you reconnect · 3 edits waiting
       <button class="btn sm ghost" data-act="reconnect">Reconnect</button></div>`
    : "";
}

function renderStates() {
  const btn = ([k, l]) => `<button class="${S.s === k ? "on" : ""}" data-state="${k}" title="${k} · ${l}">${k}</button>`;
  $("#states").innerHTML = `<span class="l">State</span>${STATES.map(btn).join("")}<button data-act="theme" title="Light / dark (T)">${ic("moon")}</button>`;
}

function renderTabbar() {
  const tab = (v, icon, l) => `<button class="tab ${S.view === v ? "on" : ""}" data-view="${v}">${ic(icon)}${l}</button>`;
  $("#tabbar").innerHTML = tab("home", "home", "Home") + tab("notes", "notes", "Notes")
    + `<button class="plus" data-act="new" title="New note">${ic("plus")}</button>`
    + tab("tasks", "task", "Tasks") + tab("shortcuts", "star", "Shortcuts");
}

function keepSelectionVisible() {
  if (WIDE.has(S.view)) return;
  const list = currentList();
  const pinned = S.scr === "note" && byId[S.note];
  if (list.length && !pinned && !list.some((n) => n._id === S.note)) S.note = list[0]._id;
}

function render() {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = S.theme || (dark ? "dark" : "light");
  const app = $("#app"), m = isMobile();
  app.classList.toggle("wide", WIDE.has(S.view));
  app.classList.toggle("m", m);
  app.classList.toggle("scr-note", m && S.scr === "note");
  app.classList.toggle("scr-list", m && S.scr !== "note");
  app.classList.toggle("drawer", m && S.drawer);
  document.body.classList.toggle("framed", S.frame && window.innerWidth > 700);
  document.body.classList.toggle("noui", S.noui);
  keepSelectionVisible();
  const q = document.activeElement?.id === "q" ? document.activeElement.selectionStart : null;
  renderOffline(); renderSidebar(); renderList(); renderEditor(); renderWide(); renderStates(); renderTabbar();
  if (q !== null) { $("#q").focus(); $("#q").setSelectionRange(q, q); }
  $(".row.on")?.scrollIntoView({ block: "nearest" });
}
let toastTimer;
function toast(msg, action, fn) {
  const layer = $("#layer");
  clearTimeout(toastTimer);
  layer.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${action ? `<button id="toastbtn">${action}</button>` : ""}</div>`;
  if (action) $("#toastbtn").onclick = () => { layer.innerHTML = ""; fn(); };
  toastTimer = setTimeout(() => (layer.innerHTML = ""), 4200);
}

function flashLine(sel) {
  requestAnimationFrame(() => {
    const el = $(`[data-b="${sel}"]`);
    if (!el) return;
    el.scrollIntoView({ block: "center" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 60);
  });
}

function openNote(id, extra = {}) {
  const n = byId[id];
  if (!n) return;
  const inList = !WIDE.has(S.view) && currentList().includes(n);
  const where = inList ? {} : { view: "notes", nb: n.notebook._ref, tag: null, q: "", drawer: false };
  go({ ...where, note: id, scr: "note", ...extra });
}

function newNote() {
  const nb = S.nb || "fx-nb-inbox", id = "fx-note-n" + Date.now().toString(36);
  const body = { blocks: [{ id: id + "-p0", type: "paragraph", content: [{ type: "text", value: "" }] }] };
  const n = { _type: "note", _id: id, title: "", notebook: { _ref: nb }, tags: [], body, links: [], updated: META.now };
  NOTES.push(n);
  byId[id] = n;
  go({ view: "notes", nb, q: "", tag: null, note: id, scr: "note", edit: false, conflict: false });
  $("[data-title]")?.focus();
}
const CLEAR = { tag: null, q: "", scr: "list", drawer: false, edit: false, conflict: false };
const INSERT = [["image", "Image"], ["file", "File"], ["task", "Checklist"], ["table", "Table"], ["link", "Link to note"], ["code", "Code block"], ["minus", "Divider"]];

function toggleCheck(ref) {
  const [nid, bid, i] = ref.split("|");
  const it = byId[nid].body.blocks.find((x) => x.id === bid).items[+i];
  it.checked = !it.checked;
  render();
}

function openCite(id, qt) {
  const blk = byId[id].body.blocks.find((b) => blockText(b).includes(qt));
  openNote(id, { ask: S.ask });
  if (blk) flashLine(blk.id);
}

function toggleInsertMenu(btn) {
  if ($(".menu")) return $(".menu").remove();
  const r = btn.getBoundingClientRect(), menu = document.createElement("div");
  menu.className = "menu";
  menu.style.cssText = `position:fixed;left:${r.left}px;top:${r.bottom + 4}px`;
  menu.innerHTML = INSERT.map(([i, l]) => `<div class="mi">${ic(i)}${l}</div>`).join("");
  document.body.appendChild(menu);
}

const ACTS = {
  new: () => newNote(),
  ask: () => go({ ask: !S.ask, edit: false }, "replace"),
  aiedit: () => (S.edit ? go({ edit: false }) : startEdit()),
  acceptall: () => EDIT.changes.forEach((c, k) => resolveHunk(k, "yes")),
  rejectall: () => EDIT.changes.forEach((c, k) => resolveHunk(k, "no")),
  undoedit: () => { byId[EDIT.note].body = JSON.parse(EDIT.snapshot); EDIT = null; toast("AI Edit undone. The note is back as it was."); go({ edit: false }); },
  doneedit: () => { EDIT = null; go({ edit: false }); },
  aioff: () => { toast("AI is off. ✨ and AI Edit are hidden.", "Turn on", () => go({ aiOff: false })); go({ aiOff: true, ask: false, edit: false }); },
  theme: () => go({ theme: document.documentElement.dataset.theme === "dark" ? "light" : "dark" }, "replace"),
  clearq: () => go({ q: "" }),
  cleartag: () => go({ tag: null }),
  reconnect: () => { toast("Back online. 3 edits synced."); go({ offline: false }); },
  tobacklinks: () => $("#linked")?.scrollIntoView({ behavior: "smooth", block: "start" }),
  back: () => go({ scr: "list" }),
  drawer: () => go({ drawer: !S.drawer }, "replace"),
};

const CLICKS = {
  tw: (v) => { OPEN_STACKS.has(v) ? OPEN_STACKS.delete(v) : OPEN_STACKS.add(v); renderSidebar(); },
  state: (v) => applyState(+v),
  check: toggleCheck,
  hunk: (v) => { const [k, st] = v.split("|"); resolveHunk(+k, st); },
  keep: (v) => keepVersion(v),
  cite: (v, d) => openCite(v, d.qt),
  line: (v) => { const [nid, sel] = v.split("|"); openNote(nid); flashLine(sel); },
  tf: (v) => go({ tf: v }, "replace"),
  tag: (v) => go({ ...CLEAR, view: "notes", nb: null, tag: v }),
  view: (v) => go({ ...CLEAR, view: v, nb: null, ask: false }),
  nb: (v) => go({ ...CLEAR, view: "notes", nb: v }),
  row: (v) => go({ note: v, scr: "note", edit: S.edit && EDIT?.note === v, conflict: S.conflict && v === CONFLICT.note }),
  open: (v) => openNote(v),
  act: (v, d, el) => (v === "insert" ? toggleInsertMenu(el) : ACTS[v]?.()),
};

document.addEventListener("click", (e) => {
  const el = e.target.closest(Object.keys(CLICKS).map((k) => `[data-${k}]`).join(","));
  if (el?.dataset.act !== "insert") $(".menu")?.remove();
  if (!el) return;
  const key = Object.keys(CLICKS).find((k) => k in el.dataset);
  e.preventDefault();
  CLICKS[key](el.dataset[key], el.dataset, el);
});

document.addEventListener("input", (e) => {
  const t = e.target, n = byId[S.note];
  if (t.id === "q" || "msearch" in t.dataset) return go({ q: t.value, scr: "list", view: WIDE.has(S.view) ? "notes" : S.view }, "replace");
  if (!n) return;
  if ("title" in t.dataset) {
    n.title = t.textContent;
    const row = $(`[data-row="${n._id}"] .row-t`);
    if (row) row.textContent = n.title || "Untitled";
  }
  const s = $("#saved");
  if (!s) return;
  s.innerHTML = `${ic("clock")}Saving…`;
  clearTimeout(s.timer);
  s.timer = setTimeout(() => (s.innerHTML = `${ic("check")}All changes saved`), 500);
});

window.addEventListener("resize", () => render());
function move(dir) {
  if (WIDE.has(S.view)) return;
  const list = currentList();
  if (!list.length) return;
  const i = list.findIndex((n) => n._id === S.note);
  const id = list[Math.max(0, Math.min(list.length - 1, i + dir))]._id;
  go({ note: id, edit: S.edit && EDIT?.note === id, conflict: S.conflict && id === CONFLICT.note }, "replace");
}

function focusSearch() {
  const q = $("#q");
  q?.focus();
  q?.select();
}

function onTypingKey(e, t) {
  if (t.id === "q" && e.key === "ArrowDown") { e.preventDefault(); t.blur(); move(1); }
  if ("title" in t.dataset && e.key === "Enter") { e.preventDefault(); $("[data-body]")?.focus(); }
  if (e.key !== "Escape") return;
  t.blur();
  if (t.id === "q" && S.q) go({ q: "" });
}

const KEYS = {
  ArrowDown: () => move(1),
  ArrowUp: () => move(-1),
  "/": focusSearch,
  n: newNote,
  t: ACTS.theme,
  Enter: () => $("[data-body]")?.focus(),
  Escape: () => { $(".menu")?.remove(); if (S.ask) go({ ask: false }, "replace"); else if (S.drawer) go({ drawer: false }, "replace"); },
};

document.addEventListener("keydown", (e) => {
  const t = e.target, mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); return focusSearch(); }
  if (isTyping(t)) return onTypingKey(e, t);
  if (mod || e.altKey) return;
  if (/^[1-8]$/.test(e.key)) return applyState(+e.key);
  if (!KEYS[e.key]) return;
  e.preventDefault();
  KEYS[e.key]();
});
if (location.hash.length > 1) fromHash(); else { applyState(1, false); history.replaceState(null, "", toHash()); }
render();
</script>
</body>
</html>
